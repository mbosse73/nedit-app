<script>
"use strict";

/* ============================================================
   3 — DATEN: EINE EINZIGE QUELLE

   `Z` hält alles Veränderliche. Nie neu zuweisen — immer an Ort und
   Stelle ändern, sonst zeigen Verweise ins Leere. Nach jeder Änderung
   `bewahre()`, sonst ist sie beim Neuladen weg.

   Ein Block ist `{art, text}`, dazu je nach Art `fertig` (To-do) und
   `sprache` (Codeblock). Der **Text ist immer Rohtext** — die Fläche
   zeigt ihn gerendert, gespeichert wird nie etwas anderes als
   Markdown. Das ist die tragende Entscheidung dieser Anwendung.
   ============================================================ */
const SCHLUESSEL = "notion-md-editor";
const Z = { name:"unbenannt.md", stufe:"rein", thema:"hell", satz:"links",
            druck:"schlicht", bloecke:[] };

const $  = (w) => document.querySelector(w);
const el = (tag, klasse, html) => {
  const n = document.createElement(tag);
  if (klasse) n.className = klasse;
  if (html !== undefined) n.innerHTML = html;
  return n;
};
const esc = (s) => String(s).replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

let zettelUhr = null;
function melde(text){
  const z = $("#zettel");
  z.textContent = text; z.classList.add("an");
  clearTimeout(zettelUhr);
  zettelUhr = setTimeout(() => z.classList.remove("an"), 2600);
}

let bewahrUhr = null;
function bewahreSofort(){
  clearTimeout(bewahrUhr);
  merken();
  try {
    localStorage.setItem(SCHLUESSEL, JSON.stringify(
      { format:1, name:Z.name, stufe:Z.stufe, thema:Z.thema, satz:Z.satz,
        druck:Z.druck, text:schreibeMarkdown(Z.bloecke) }));
    $("#f-stand").textContent = "gespeichert";
  } catch (e) {
    $("#f-stand").textContent = "nicht gespeichert";
    melde("Speichern ging nicht: " + e.message);
  }
}

/* Beim Tippen gebündelt — sonst schriebe jeder Anschlag in den
   Speicher. Eine Einstellung dagegen wird **sofort** gesichert:
   Wer sie umstellt und das Fenster schließt, hat sonst nichts davon. */
function bewahre(){
  clearTimeout(bewahrUhr);
  bewahrUhr = setTimeout(bewahreSofort, 400);
}

function lade(){
  let roh = null;
  try { roh = localStorage.getItem(SCHLUESSEL); } catch (e) { /* privater Modus */ }
  if (!roh) return false;
  try {
    const d = JSON.parse(roh);
    Z.name = d.name || "unbenannt.md";
    if (KOENNEN[d.stufe]) Z.stufe = d.stufe;
    ["thema","satz","druck"].forEach(f => { if (d[f]) Z[f] = d[f]; });
    ersetze(Z.bloecke, leseMarkdown(d.text || ""));
    return true;
  } catch (e) { melde("Der gespeicherte Stand ließ sich nicht lesen."); return false; }
}

/* Inhalt austauschen, ohne das Array selbst zu ersetzen. */
function ersetze(ziel, neu){ ziel.length = 0; neu.forEach(x => ziel.push(x)); }

/* ---------- Der Verlauf ----------
   Das Textfeld kann nur innerhalb eines Blocks zurücknehmen. Ein
   gelöschter, verschobener oder umgewandelter Block käme so nie
   zurück — der einzige Punkt dieser Anwendung, an dem ohne ihn
   Arbeit verloren geht.

   Gemerkt wird der **ganze Markdown-Text**, nicht ein Unterschied.
   Das ist grob und aus demselben Grund richtig wie `male()`: Jede
   strukturelle Änderung verschiebt Indizes, und ein Verlauf aus
   Teilschritten wäre die Quelle jedes zweiten Fehlers. Ein Stand von
   hundert Blöcken sind ein paar Kilobyte.

   Beim Tippen fällt kein Stand je Anschlag an: `merken()` hängt an
   `bewahreSofort()` und damit an derselben Bündelung. */
const VERLAUF = { staende:[], stelle:-1, sperre:false };
const VERLAUF_TIEF = 120;

function merken(){
  if (VERLAUF.sperre) return;
  const text = schreibeMarkdown(Z.bloecke);
  if (VERLAUF.staende[VERLAUF.stelle] === text) return;
  VERLAUF.staende.length = VERLAUF.stelle + 1;   /* was wiederholt werden konnte, gilt nicht mehr */
  VERLAUF.staende.push(text);
  if (VERLAUF.staende.length > VERLAUF_TIEF) VERLAUF.staende.shift();
  VERLAUF.stelle = VERLAUF.staende.length - 1;
}

function verlaufAnwenden(){
  VERLAUF.sperre = true;
  ersetze(Z.bloecke, leseMarkdown(VERLAUF.staende[VERLAUF.stelle]));
  aktiv = -1;
  bewahreSofort();
  male();
  VERLAUF.sperre = false;
}

function zurueck(){
  if (VERLAUF.stelle <= 0){ melde("Nichts mehr rückgängig zu machen."); return; }
  VERLAUF.stelle--; verlaufAnwenden();
  melde("Rückgängig");
}

function wieder(){
  if (VERLAUF.stelle >= VERLAUF.staende.length - 1){ melde("Nichts zu wiederholen."); return; }
  VERLAUF.stelle++; verlaufAnwenden();
  melde("Wiederhergestellt");
}

/* ---------- Die Markdown-Stufe ----------
   Harte Regel 9: Alles, was über reines Markdown hinausgeht, hängt an
   der Stufe und wird gekennzeichnet. Was die gewählte Stufe nicht
   kann, wird **gar nicht erst angeboten** — statt es anzubieten und
   hinterher zu enttäuschen.

   Die Stufe ändert nie die Datei. Sie ändert, was der Editor
   anbietet und wie er zeigt, was schon dasteht: Auf „Rein" bleibt
   `~~so~~` als Zeichenfolge stehen, weil ein reiner Markdown-Leser
   genau das zeigen würde. Dieselbe Fläche, andere Ausgabe. */
const STUFEN = [
  ["rein",     "Rein",
   "Nur was in <b>jedem</b> Werkzeug der Welt läuft. Kein To-do, keine Tabelle, "
   + "kein Durchgestrichen. Die Datei ist überall dieselbe."],
  ["github",   "GitHub",
   "GitHub-Markdown (GFM): <b>To-do-Listen</b>, <b>Tabellen</b>, "
   + "<b>~~durchgestrichen~~</b> und Hinweiskästen. Der verbreitetste Standard."],
  ["obsidian", "Obsidian",
   "Wie GitHub, dazu der <b>==Textmarker==</b>. Bindet die Datei an Werkzeuge, "
   + "die diese Schreibweise kennen."],
  ["pandoc",   "Pandoc",
   "Tabellen und Durchgestrichen. <b>Keine To-dos, keine Hinweiskästen</b> — "
   + "Pandoc kennt sie ohne Erweiterung nicht."]
];

const KOENNEN = {
  rein:     [],
  github:   ["todo","tabelle","durch","callout","html"],
  obsidian: ["todo","tabelle","durch","callout","html","marker"],
  pandoc:   ["tabelle","durch","html"]
};

function kann(merkmal){ return KOENNEN[Z.stufe].indexOf(merkmal) >= 0; }

/* ============================================================
   4 — MARKDOWN LESEN UND SCHREIBEN

   Beide Richtungen stehen hier nebeneinander und gehören zusammen
   geändert. Die Regel dazu: **lesen(schreiben(x)) muss x ergeben.**
   Was das nicht erfüllt, gehört nicht in den Umwandler.
   ============================================================ */
const GRUPPIERT = ["punkt","nummer","todo","zitat"];   /* stehen ohne Leerzeile untereinander */
const LISTE     = ["punkt","nummer","todo"];          /* lassen sich einrücken */
const MEHRZEILIG = ["code","tabelle","callout","toggle"];  /* Enter bricht die Zeile */

/* Einrückung in Stufen. **Zwei Leerzeichen sind eine Stufe**, ein
   Tabulator zählt ebenso. Vier Leerzeichen — die andere verbreitete
   Schreibweise — ergeben zwei Stufen und werden als vier Leerzeichen
   zurückgeschrieben; der Rundlauf bleibt also verlustfrei. Eine
   ungerade Einrückung wird auf die nächstkleinere Stufe
   vereinheitlicht. Das ist der einzige Ort, an dem dieser Umwandler
   etwas begradigt, und er tut es offen.

   Das Feld heißt `tiefe` und nicht `stufe`: `Z.stufe` ist die
   Markdown-Stufe des Dialektschalters, und zwei Dinge gleichen
   Namens in einem Modell sind eine Fehlerquelle. */
const MAXTIEFE = 6;
const einzug = (s) => Math.min(MAXTIEFE, Math.floor(s.replace(/\t/g, "  ").length / 2));

/* Die laufenden Nummern für alle Blöcke auf einmal. Eine Unterliste
   fängt bei 1 an; kehrt sie zur flacheren Stufe zurück, läuft deren
   Zähler weiter. Steht hier und nicht in Abschnitt 5, weil
   `schreibeMarkdown` dieselbe Rechnung braucht — zwei Fassungen
   davon liefen unweigerlich auseinander. */
function nummern(bloecke){
  const aus = [], zaehler = [];
  bloecke.forEach((b, i) => {
    const vor = bloecke[i-1], tiefe = b.tiefe || 0;
    if (LISTE.indexOf(b.art) < 0){ zaehler.length = 0; aus.push(0); return; }
    const kette = vor && LISTE.indexOf(vor.art) >= 0;
    if (b.art === "nummer"){
      if (!kette || (vor.tiefe || 0) < tiefe) zaehler[tiefe] = 1;
      else zaehler[tiefe] = (zaehler[tiefe] || 0) + 1;
    }
    for (let k = tiefe + 1; k < zaehler.length; k++) zaehler[k] = 0;
    aus.push(b.art === "nummer" ? zaehler[tiefe] : 0);
  });
  return aus;
}

const mitTiefe = (b, tiefe) => { if (tiefe > 0) b.tiefe = tiefe; return b; };

function leseMarkdown(text){
  const zeilen = String(text || "").replace(/\r\n?/g, "\n").split("\n");
  const aus = [];
  let absatz = null;                       /* laufender Absatz aus mehreren Zeilen */
  const schliesse = () => {
    if (absatz !== null) { aus.push({art:"absatz", text:absatz}); absatz = null; }
  };

  for (let i = 0; i < zeilen.length; i++){
    const z = zeilen[i];

    /* Codeblock zuerst: Was zwischen den Zäunen steht, wird nicht gedeutet. */
    const zaun = z.match(/^```(\S*)\s*$/);
    if (zaun){
      schliesse();
      const rumpf = [];
      i++;
      while (i < zeilen.length && !/^```\s*$/.test(zeilen[i])) rumpf.push(zeilen[i++]);
      aus.push({art:"code", sprache:zaun[1] || "", text:rumpf.join("\n")});
      continue;
    }
    if (/^\s*(-{3,}|\*{3,}|_{3,})\s*$/.test(z)){
      schliesse(); aus.push({art:"linie", text:""}); continue; }

    /* Toggle. HTML mitten im Text — der Notausgang aus
       doku/ENTSCHEIDUNGEN.md, Punkt 1, und als solcher gekennzeichnet.
       Der ganze Bereich landet als Rohtext in einem Block. */
    if (/^<details>\s*$/.test(z)){
      schliesse();
      const teil = [z];
      while (i + 1 < zeilen.length && !/^<\/details>\s*$/.test(zeilen[i+1])) teil.push(zeilen[++i]);
      if (i + 1 < zeilen.length) teil.push(zeilen[++i]);
      aus.push({art:"toggle", text:teil.join("\n")});
      continue;
    }

    /* Callout **vor** dem Zitat: Er sieht aus wie eines und ist keines. */
    if (/^>\s*\[![A-Za-z]+\]\s*$/.test(z)){
      schliesse();
      const teil = [z];
      while (i + 1 < zeilen.length && /^>/.test(zeilen[i+1])) teil.push(zeilen[++i]);
      aus.push({art:"callout", text:teil.join("\n")});
      continue;
    }

    /* Tabelle: eine Zeile mit Balken, darunter die Trennzeile. Ohne
       die zweite Zeile ist es keine Tabelle, sondern ein Absatz mit
       Balken darin. */
    if (/^\s*\|/.test(z) && i + 1 < zeilen.length
        && /^\s*\|[\s:|-]+\|\s*$/.test(zeilen[i+1])){
      schliesse();
      const teil = [z];
      while (i + 1 < zeilen.length && /^\s*\|/.test(zeilen[i+1])) teil.push(zeilen[++i]);
      aus.push({art:"tabelle", text:teil.join("\n")});
      continue;
    }

    let m;
    if ((m = z.match(/^(#{1,3})\s+(.*)$/))){
      schliesse(); aus.push({art:"h" + m[1].length, text:m[2]}); continue; }
    if ((m = z.match(/^([ \t]*)[-*]\s+\[([ xX])\]\s*(.*)$/))){
      schliesse(); aus.push(mitTiefe({art:"todo", fertig:m[2] !== " ", text:m[3]},
                                     einzug(m[1]))); continue; }
    if ((m = z.match(/^([ \t]*)[-*]\s+(.*)$/))){
      schliesse(); aus.push(mitTiefe({art:"punkt", text:m[2]}, einzug(m[1]))); continue; }
    if ((m = z.match(/^([ \t]*)\d+[.)]\s+(.*)$/))){
      schliesse(); aus.push(mitTiefe({art:"nummer", text:m[2]}, einzug(m[1]))); continue; }
    if ((m = z.match(/^>\s?(.*)$/))){
      schliesse(); aus.push({art:"zitat", text:m[1]}); continue; }

    if (!z.trim()){ schliesse(); continue; }
    absatz = absatz === null ? z : absatz + "\n" + z;
  }
  schliesse();
  if (!aus.length) aus.push({art:"absatz", text:""});
  return aus;
}

function schreibeMarkdown(bloecke){
  const aus = [];
  const nr = nummern(bloecke);
  bloecke.forEach((b, i) => {
    const vor = bloecke[i-1];
    const tiefe = b.tiefe || 0;
    /* Eine Leerzeile zwischen zwei Blöcken — außer sie gehören zur
       selben Liste. Eine Unterliste gehört auch dann dazu, wenn sie
       eine andere Art hat: `- a` mit `1. b` darunter ist eine Liste,
       nicht zwei. */
    const zusammen = vor && (
         (GRUPPIERT.indexOf(b.art) >= 0 && b.art === vor.art)
      || (LISTE.indexOf(b.art) >= 0 && LISTE.indexOf(vor.art) >= 0
          && tiefe !== (vor.tiefe || 0)));
    if (i && !zusammen) aus.push("");
    const ein = "  ".repeat(tiefe);

    if (b.art === "code")        aus.push("```" + (b.sprache || ""), b.text, "```");
    /* Tabelle, Callout und Toggle tragen ihre ganze Quelle im Feld
       `text`. Sie geht unverändert wieder heraus — damit ist der
       Rundlauf für sie ohne weiteres Zutun verlustfrei, und der Block
       hat weiterhin genau ein Feld (doku/ENTSCHEIDUNGEN.md, Punkt 7). */
    else if (b.art === "tabelle" || b.art === "callout" || b.art === "toggle")
                                 aus.push(b.text);
    else if (b.art === "linie")  aus.push("---");
    else if (b.art === "h1")     aus.push("# "   + b.text);
    else if (b.art === "h2")     aus.push("## "  + b.text);
    else if (b.art === "h3")     aus.push("### " + b.text);
    else if (b.art === "punkt")  aus.push(ein + "- "   + b.text);
    else if (b.art === "nummer") aus.push(ein + nr[i] + ". " + b.text);
    else if (b.art === "todo")   aus.push(ein + "- [" + (b.fertig ? "x" : " ") + "] " + b.text);
    else if (b.art === "zitat")  aus.push("> "   + b.text);
    else                         aus.push(b.text);
  });
  return aus.join("\n") + "\n";
}

/* Auszeichnung im Text. Sie wird **nur zum Anzeigen** gerechnet; der
   Rohtext bleibt unangetastet. Code kommt zuerst heraus, damit
   Sternchen darin nicht als fett gelesen werden. */
function inlineMalen(t){
  if (!t) return "";
  const halter = [];
  let s = esc(t).replace(/`([^`\n]+)`/g, (_, x) => {
    halter.push("<code>" + x + "</code>");
    return "␀" + (halter.length - 1) + "␀";
  });
  /* Bilder **vor** den Verweisen: `![a](b)` enthält `[a](b)`, sonst
     bliebe das Ausrufezeichen als Text vor einem Verweis stehen. */
  s = s.replace(/!\[([^\]\n]*)\]\(([^)\s]+)\)/g, (_, titel, quelle) => {
    const q = quelle.replace(/"/g, "%22");
    /* Alles mit Schema ausser file: käme aus dem Netz. */
    if (/^[a-z][a-z0-9+.-]*:/i.test(q) && !/^file:/i.test(q))
      return '<span class="fern">' + esc(q) + "</span>";
    return '<img src="' + q + '" alt="' + titel.replace(/"/g, "&quot;") + '" loading="lazy">';
  });
  s = s.replace(/\[([^\]\n]+)\]\(([^)\s]+)\)/g, '<span class="verweis">$1</span>');
  s = s.replace(/\*\*([^*\n]+)\*\*/g, "<b>$1</b>");
  s = s.replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<i>$2</i>");
  /* Was die Stufe nicht kann, bleibt als Zeichenfolge stehen — der
     Editor zeigt, was das Zielwerkzeug zeigen würde. */
  if (kann("durch"))  s = s.replace(/~~([^~\n]+)~~/g, "<s>$1</s>");
  if (kann("marker")) s = s.replace(/==([^=\n]+)==/g, "<mark>$1</mark>");
  return s.replace(/␀(\d+)␀/g, (_, i) => halter[Number(i)]);
}

/* Was auf der Fläche steht, wenn die Schreibmarke **nicht** im Block
   ist. Für die meisten Blöcke ist das die Auszeichnung im Text; drei
   brauchen mehr, und der Codeblock braucht weniger — in ihm wird
   nichts gedeutet. */
function blockInhalt(b){
  if (b.art === "code")    return esc(b.text);
  if (b.art === "tabelle") return tabelleMalen(b.text);
  if (b.art === "callout") return calloutMalen(b.text);
  if (b.art === "toggle")  return toggleMalen(b.text);
  return inlineMalen(b.text);
}

function tabelleMalen(text){
  const zeilen = String(text || "").split("\n").filter(z => z.trim());
  if (!zeilen.length) return "";
  const zellen = (z) => z.replace(/^\s*\|/, "").replace(/\|\s*$/, "")
                         .split("|").map(x => inlineMalen(x.trim()));
  const kopf = zellen(zeilen[0]);
  const rumpf = zeilen.slice(2).map(zellen);
  return "<table><thead><tr>"
    + kopf.map(x => "<th>" + x + "</th>").join("")
    + "</tr></thead><tbody>"
    + rumpf.map(r => "<tr>" + r.map(x => "<td>" + x + "</td>").join("") + "</tr>").join("")
    + "</tbody></table>";
}

/* GitHub kennt fünf Sorten. Die Farbe folgt der Dringlichkeit, nicht
   der Kategorie: Warnung und Vorsicht sind rot, der Rest blau. */
const CALLOUT = {NOTE:"Hinweis", TIP:"Tipp", IMPORTANT:"Wichtig",
                 WARNING:"Warnung", CAUTION:"Vorsicht"};

function calloutSorte(text){
  const m = String(text || "").match(/^>\s*\[!([A-Za-z]+)\]/);
  return m ? m[1].toUpperCase() : "NOTE";
}

function calloutMalen(text){
  const zeilen = String(text || "").split("\n");
  const sorte = calloutSorte(text);
  const rumpf = zeilen.slice(1).map(z => z.replace(/^>\s?/, ""));
  return '<span class="sorte">' + esc(CALLOUT[sorte] || sorte) + "</span>"
    + inlineMalen(rumpf.join("\n"));
}

function toggleMalen(text){
  const zeilen = String(text || "").split("\n");
  let titel = "";
  const rumpf = [];
  zeilen.forEach(z => {
    if (/^<\/?details>\s*$/.test(z)) return;
    const t = z.match(/^<summary>(.*)<\/summary>\s*$/);
    if (t && !titel){ titel = t[1]; return; }
    rumpf.push(z);
  });
  return '<span class="haupt">' + inlineMalen(titel || "Ohne Titel") + "</span>"
    + '<span class="rumpf">' + inlineMalen(rumpf.join("\n").replace(/^\n+|\n+$/g, "")) + "</span>";
}

/* ============================================================
   5 — DIE FLÄCHE

   `male()` baut alles neu. Das ist grob, aber richtig: Jede
   strukturelle Änderung — Enter, Backspace, Umwandeln, Ziehen —
   verschiebt Blöcke, und Teilzeichnen wäre hier die Quelle jedes
   zweiten Fehlers. Beim Tippen wird **nicht** gemalt; dort wandert
   nur der Text ins Modell.
   ============================================================ */
/* Das Urteil aus doku/BLOCKKATALOG.md, an den Block geheftet. Blöcke
   ohne Eintrag sind reines Markdown und brauchen keine Kennzeichnung. */
const URTEIL = {todo:"GFM", tabelle:"GFM", callout:"Dialekt", toggle:"HTML"};

const SVG = (d) => '<svg viewBox="0 0 20 20" aria-hidden="true">' + d + '</svg>';
const IK_PLUS  = SVG('<path d="M10 4.2v11.6M4.2 10h11.6"/>');
const IK_GRIFF = SVG('<circle cx="7.6" cy="5" r="1.05"/><circle cx="12.4" cy="5" r="1.05"/>'
                   + '<circle cx="7.6" cy="10" r="1.05"/><circle cx="12.4" cy="10" r="1.05"/>'
                   + '<circle cx="7.6" cy="15" r="1.05"/><circle cx="12.4" cy="15" r="1.05"/>');
const IK_HAKEN = '<svg viewBox="0 0 20 20" aria-hidden="true">'
               + '<path d="M4.6 10.4 8.2 14l7.2-8"/></svg>';

let aktiv = -1;          /* Index des Blocks unter der Schreibmarke */
let ziehtVon = -1;       /* Index des gezogenen Blocks */

/* Einmal je Anstrich gerechnet, nicht je Block: `nummern()` läuft
   sonst für jede Zeile über die ganze Liste. */
let NUMMERN = [];
function nummerVon(i){ return NUMMERN[i] || 1; }

function blockMalen(b, i){
  const n = el("div", "blk " + b.art + (b.fertig ? " fertig" : ""));
  n.dataset.i = String(i);
  if (b.tiefe) n.style.setProperty("--tiefe", String(b.tiefe));

  const griff = el("span", "griff");
  const plus = el("button", null, IK_PLUS);
  plus.type = "button"; plus.title = "Darüber einfügen";
  plus.setAttribute("aria-label", "Block darüber einfügen");
  plus.onclick = () => { Z.bloecke.splice(i, 0, {art:"absatz", text:""}); bewahre(); male(i, 0); };
  const fass = el("button", null, IK_GRIFF);
  fass.type = "button"; fass.title = "Ziehen zum Verschieben";
  fass.setAttribute("aria-label", "Block verschieben");
  /* Ziehen wird erst beim Anfassen erlaubt. Wäre der Block immer
     `draggable`, ließe sich sein Text nicht mehr markieren. */
  fass.addEventListener("mousedown", () => { n.draggable = true; });
  fass.addEventListener("mouseup",   () => { n.draggable = false; });
  fass.title = "Ziehen zum Verschieben, Klicken für das Menü";
  fass.onclick = () => blockMenue(i, fass);
  griff.append(plus, fass);
  n.appendChild(griff);

  if (b.art === "punkt")  n.appendChild(el("span", "marke", "•"));
  if (b.art === "nummer") n.appendChild(el("span", "marke", nummerVon(i) + "."));
  if (b.art === "todo"){
    const m = el("span", "marke");
    const k = el("button", "kasten", IK_HAKEN);
    k.type = "button";
    k.setAttribute("aria-label",
      (b.fertig ? "Wieder offen: " : "Erledigt: ") + (b.text || "Aufgabe"));
    k.setAttribute("aria-pressed", String(!!b.fertig));
    k.onclick = () => { b.fertig = !b.fertig; bewahre(); male(); };
    m.appendChild(k); n.appendChild(m);
  }
  if (b.art === "code" && b.sprache) n.appendChild(el("span", "sprache", esc(b.sprache)));
  if (b.art === "linie"){ n.appendChild(el("span", "strich")); return n; }

  /* Was kein reines Markdown ist, wird gekennzeichnet, nicht
     versteckt — doku/ENTSCHEIDUNGEN.md, Punkt 1. */
  if (URTEIL[b.art]) n.appendChild(el("span", "urteil", URTEIL[b.art]));
  if (b.art === "callout"){
    const sorte = calloutSorte(b.text);
    if (sorte === "WARNING" || sorte === "CAUTION") n.classList.add("warnung");
  }

  const t = el("div", "txt");
  t.contentEditable = "true";
  t.spellcheck = false;
  t.dataset.leer = (i === 0 && Z.bloecke.length === 1)
    ? "Beginne zu schreiben …"
    : "Leerer Block";
  if (i === aktiv) t.textContent = b.text; else t.innerHTML = blockInhalt(b);
  n.appendChild(t);
  return n;
}

function male(fokusIndex, fokusPos){
  if (fokusIndex !== undefined) aktiv = fokusIndex;
  NUMMERN = nummern(Z.bloecke);
  const s = $("#spalte");
  s.innerHTML = "";
  Z.bloecke.forEach((b, i) => s.appendChild(blockMalen(b, i)));
  fundeZeigen();
  gliederungMalen();
  quelleMalen();
  fussMalen();
  if (fokusIndex !== undefined) setzeFokus(fokusIndex, fokusPos === undefined ? 0 : fokusPos);
}

function textVon(i){ return $('.blk[data-i="' + i + '"] .txt'); }

function setzeFokus(i, pos){
  const n = textVon(i);
  if (!n) return;
  aktiv = i;
  n.textContent = Z.bloecke[i].text;      /* Rohtext, solange die Marke hier steht */
  n.focus();
  setzePos(n, pos < 0 ? n.textContent.length : pos);
}

/* Position der Schreibmarke, gezählt in Zeichen ab Blockanfang. */
function holePos(n){
  const s = getSelection();
  if (!s.rangeCount) return 0;
  const r = s.getRangeAt(0);
  const ganz = document.createRange();
  ganz.selectNodeContents(n);
  try { ganz.setEnd(r.endContainer, r.endOffset); } catch (e) { return 0; }
  return ganz.toString().length;
}
function setzePos(n, pos){
  const r = document.createRange();
  const t = n.firstChild;
  if (!t) r.setStart(n, 0);
  else r.setStart(t, Math.max(0, Math.min(pos, t.textContent.length)));
  r.collapse(true);
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

function quelleMalen(){
  const q = $("#q");
  if (document.activeElement === q) return;      /* nicht unter den Händen austauschen */
  q.value = schreibeMarkdown(Z.bloecke);
  q.readOnly = $("#app").dataset.ansicht !== "quelltext";
  $("#qhinweis").textContent = q.readOnly
    ? "nur lesen — zum Ändern auf „Quelltext“ umschalten"
    : "schreibbar";
  $("#qname").textContent = Z.name;
}

function fussMalen(){
  const text = schreibeMarkdown(Z.bloecke);
  const worte = text.trim() ? text.trim().split(/\s+/).length : 0;
  $("#f-woerter").textContent = String(worte);
  $("#f-zeichen").textContent = String(text.length);
  $("#f-bloecke").textContent = String(Z.bloecke.length);
  $("#dateiname").textContent = Z.name;
}

/* ============================================================
   6 — TIPPEN

   Die Eingabehilfen sind der Grund, warum dieser Editor ein
   Markdown-Editor bleibt und keine zweite Auszeichnungssprache
   erfindet: Wer `## ` tippt, bekommt eine Überschrift; wer sie über
   ein Menü setzt, bekommt dasselbe `##` in der Datei.
   ============================================================ */
const HILFEN = [
  [/^# $/,              () => ({art:"h1"})],
  [/^## $/,             () => ({art:"h2"})],
  [/^### $/,            () => ({art:"h3"})],
  [/^[-*] \[[ xX]\] $/, (m) => ({art:"todo", fertig:/[xX]/.test(m[0])})],
  [/^[-*] $/,           () => ({art:"punkt"})],
  [/^\d+[.)] $/,        () => ({art:"nummer"})],
  [/^> $/,              () => ({art:"zitat"})],
  [/^```(\S*)$/,        (m) => ({art:"code", sprache:m[1] || ""})],
  [/^(-{3,}|\*{3,})$/,  () => ({art:"linie"})]
];

function hilfePruefen(i, n){
  const b = Z.bloecke[i];
  if (MEHRZEILIG.indexOf(b.art) >= 0) return false;   /* dort wird nichts gedeutet */
  const roh = n.textContent;
  for (let k = 0; k < HILFEN.length; k++){
    const m = roh.match(HILFEN[k][0]);
    if (!m) continue;
    const neu = HILFEN[k][1](m);
    if (b.art === neu.art && neu.art !== "linie") continue;
    Object.assign(b, neu);
    b.text = "";
    if (neu.art === "linie"){
      /* Nach einer Trennlinie geht es in einem neuen Absatz weiter. */
      Z.bloecke.splice(i + 1, 0, {art:"absatz", text:""});
      bewahre(); male(i + 1, 0);
    } else {
      bewahre(); male(i, 0);
    }
    return true;
  }
  return false;
}

function tasteImBlock(ev, i, n){
  const b = Z.bloecke[i];
  const pos = holePos(n);
  const laenge = n.textContent.length;

  if (ev.key === "Enter" && !ev.shiftKey){
    /* In mehrzeiligen Blöcken bricht Enter die Zeile, statt den Block
       zu teilen: Eine Tabelle mit einer Zeile pro Block wäre keine
       Tabelle mehr. `white-space: pre-wrap` sorgt dafür, dass dabei
       ein echtes Zeilenende im Text landet. */
    if (MEHRZEILIG.indexOf(b.art) >= 0) return;
    ev.preventDefault();
    const roh = n.textContent;
    const davor = roh.slice(0, pos), danach = roh.slice(pos);
    /* Leerer Listeneintrag: Enter verlässt die Liste, statt sie fortzusetzen. */
    if (GRUPPIERT.indexOf(b.art) >= 0 && !roh.trim()){
      b.art = "absatz"; delete b.fertig; b.text = "";
      bewahre(); male(i, 0); return;
    }
    b.text = davor;
    const folgt = GRUPPIERT.indexOf(b.art) >= 0
      ? mitTiefe({art:b.art, text:danach, fertig:false}, b.tiefe || 0)
      : {art:"absatz", text:danach};
    Z.bloecke.splice(i + 1, 0, folgt);
    bewahre(); male(i + 1, 0);
    return;
  }

  if (ev.key === "Backspace" && pos === 0 && getSelection().isCollapsed){
    /* Erst die Art zurücknehmen, dann erst verschmelzen — so wie in
       Notion: Ein Backspace am Anfang einer Überschrift macht sie zum
       Absatz und löscht nichts. */
    /* Eingerückt? Dann nimmt Backspace erst die Einrückung zurück —
       sonst verlöre ein Unterpunkt beim Löschen zwei Dinge auf
       einmal, und niemand könnte sagen, welches gemeint war. */
    if (b.tiefe){
      ev.preventDefault();
      b.tiefe -= 1; if (!b.tiefe) delete b.tiefe;
      bewahre(); male(i, 0); return;
    }
    if (b.art !== "absatz"){
      ev.preventDefault();
      b.art = "absatz"; delete b.fertig; delete b.sprache;
      bewahre(); male(i, 0); return;
    }
    if (i === 0) return;
    ev.preventDefault();
    const vor = Z.bloecke[i-1];
    if (vor.art === "linie"){ Z.bloecke.splice(i-1, 1); bewahre(); male(i-1, 0); return; }
    const stelle = vor.text.length;
    vor.text += b.text;
    Z.bloecke.splice(i, 1);
    bewahre(); male(i-1, stelle);
    return;
  }

  if (ev.key === "Delete" && pos === laenge && getSelection().isCollapsed
      && i < Z.bloecke.length - 1){
    ev.preventDefault();
    const nach = Z.bloecke[i+1];
    if (nach.art === "linie"){ Z.bloecke.splice(i+1, 1); bewahre(); male(i, pos); return; }
    b.text += nach.text;
    Z.bloecke.splice(i+1, 1);
    bewahre(); male(i, pos);
    return;
  }

  if (ev.key === "ArrowUp" && pos === 0 && i > 0){
    ev.preventDefault(); setzeFokus(i-1, -1); return; }
  if (ev.key === "ArrowDown" && pos === laenge && i < Z.bloecke.length - 1){
    ev.preventDefault(); setzeFokus(i+1, 0); return; }

  if (ev.key === "Tab"){
    ev.preventDefault();
    if (LISTE.indexOf(b.art) < 0) return;         /* nur Listen rücken ein */
    const tiefe = b.tiefe || 0;
    if (ev.shiftKey){
      if (!tiefe) return;
      b.tiefe = tiefe - 1;
    } else {
      /* Höchstens eine Stufe tiefer als der Vorgänger. Eine Lücke
         darüber hinaus könnte Markdown nicht ausdrücken — sie käme
         beim nächsten Lesen als flachere Stufe zurück. */
      const vor = Z.bloecke[i-1];
      const grenze = vor && LISTE.indexOf(vor.art) >= 0 ? (vor.tiefe || 0) + 1 : 0;
      if (tiefe >= grenze || tiefe >= MAXTIEFE) return;
      b.tiefe = tiefe + 1;
    }
    if (!b.tiefe) delete b.tiefe;
    bewahre(); male(i, pos);
    return;
  }
}

/* ---------- Die Auswahlleiste ----------
   Die Knöpfe setzen **Zeichen in den Rohtext**, nichts anderes. Das
   geht nur, weil der Block unter der Schreibmarke seinen Rohtext
   zeigt (doku/ENTSCHEIDUNGEN.md, Punkt 4): Die markierten Zeichen
   sind dieselben, die in der Datei stehen — es gibt nichts
   umzurechnen.

   Was die gewählte Stufe nicht kann, steht nicht auf der Leiste.
   Harte Regel 9. */
const IK_CODE  = SVG('<path d="M7.6 6.4 3.8 10l3.8 3.6M12.4 6.4 16.2 10l-3.8 3.6"/>');
const IK_KETTE = SVG('<path d="M8.6 11.4a3.1 3.1 0 0 0 4.4 0l2-2a3.1 3.1 0 0 0-4.4-4.4l-.9.9"/>'
                   + '<path d="M11.4 8.6a3.1 3.1 0 0 0-4.4 0l-2 2a3.1 3.1 0 0 0 4.4 4.4l.9-.9"/>');

const AUSZEICHNUNG = [
  {zeichen:"**", inhalt:"<b>B</b>",              titel:"Fett (Strg B)"},
  {zeichen:"*",  inhalt:"<i>I</i>",              titel:"Kursiv (Strg I)"},
  {zeichen:"~~", inhalt:"<s>S</s>",              titel:"Durchgestrichen", merkmal:"durch"},
  {zeichen:"`",  inhalt:IK_CODE,                 titel:"Code"},
  {zeichen:"==", inhalt:'<span class="mk">A</span>', titel:"Textmarker", merkmal:"marker"}
];

/* Die Auswahl in Zeichen ab Blockanfang. Gibt `null` zurück, wenn
   nichts markiert ist oder die Markierung nicht im Block unter der
   Schreibmarke steht — nur dort steht Rohtext. */
function auswahlLesen(){
  const s = getSelection();
  if (!s.rangeCount || s.isCollapsed) return null;
  const knoten = s.anchorNode;
  const wo = knoten.nodeType === 1 ? knoten : knoten.parentNode;
  const t = wo && wo.closest ? wo.closest(".txt") : null;
  if (!t) return null;
  const blk = t.closest(".blk");
  if (!blk) return null;
  const i = Number(blk.dataset.i);
  if (i !== aktiv || !Z.bloecke[i]) return null;
  const r = s.getRangeAt(0);
  const vor = document.createRange();
  vor.selectNodeContents(t);
  try { vor.setEnd(r.startContainer, r.startOffset); } catch (e) { return null; }
  const von = vor.toString().length;
  const bis = von + r.toString().length;
  if (von === bis) return null;
  return { i:i, von:von, bis:bis, rechteck:r.getBoundingClientRect() };
}

function auswahlSetzen(i, von, bis){
  const n = textVon(i);
  if (!n || !n.firstChild) return;
  const t = n.firstChild, laenge = t.textContent.length;
  const r = document.createRange();
  r.setStart(t, Math.max(0, Math.min(von, laenge)));
  r.setEnd(t,   Math.max(0, Math.min(bis, laenge)));
  const s = getSelection(); s.removeAllRanges(); s.addRange(r);
}

/* Steht die Auswahl schon zwischen diesen Zeichen, werden sie
   entfernt — ein zweiter Klick nimmt zurück, was der erste tat. */
function auszeichnen(zeichen){
  const a = auswahlLesen();
  if (!a) return;
  const b = Z.bloecke[a.i], t = b.text, n = zeichen.length;
  const drin = a.von >= n
    && t.slice(a.von - n, a.von) === zeichen
    && t.slice(a.bis, a.bis + n) === zeichen;
  if (drin){
    b.text = t.slice(0, a.von - n) + t.slice(a.von, a.bis) + t.slice(a.bis + n);
    bewahre(); male(a.i, a.von - n);
    auswahlSetzen(a.i, a.von - n, a.bis - n);
  } else {
    b.text = t.slice(0, a.von) + zeichen + t.slice(a.von, a.bis) + zeichen + t.slice(a.bis);
    bewahre(); male(a.i, a.von + n);
    auswahlSetzen(a.i, a.von + n, a.bis + n);
  }
  leistePruefen();
}

/* Als **Verweis**, nicht eingebettet: Ein Bild in der Datei wäre kein
   lesbarer Text mehr, und die .md waere um ein Vielfaches groesser
   als ihr Inhalt. */
function bildEinfuegen(){
  const quelle = prompt("Pfad zum Bild — neben der .md-Datei, z. B. ./bilder/raster.png");
  if (!quelle) return;
  const name = quelle.split(/[\\/]/).pop().replace(/\.[a-z0-9]+$/i, "").replace(/[-_]+/g, " ");
  const md = "![" + name + "](" + quelle + ")";
  const i = aktiv >= 0 && Z.bloecke[aktiv] ? aktiv : Z.bloecke.length - 1;
  const b = Z.bloecke[i];
  if (b.text){
    Z.bloecke.splice(i + 1, 0, {art:"absatz", text:md});
    bewahre(); male(i + 1, -1);
  } else {
    b.text = md;
    bewahre(); male(i, -1);
  }
}

function verweisSetzen(){
  const a = auswahlLesen();
  if (!a) return;
  const adresse = prompt("Adresse für den Link", "https://");
  if (!adresse) return;
  const b = Z.bloecke[a.i], t = b.text;
  b.text = t.slice(0, a.von) + "[" + t.slice(a.von, a.bis) + "](" + adresse + ")"
         + t.slice(a.bis);
  bewahre(); male(a.i, a.bis + adresse.length + 4);
}

function leisteBauen(){
  const l = $("#leiste");
  l.innerHTML = "";
  const knopf = (inhalt, titel, tue) => {
    const b = el("button", null, inhalt);
    b.type = "button"; b.title = titel;
    b.setAttribute("aria-label", titel);
    b.onclick = tue;
    l.appendChild(b);
  };
  knopf(IK_KETTE, "Link", verweisSetzen);
  l.appendChild(el("span", "tr"));
  AUSZEICHNUNG.forEach(a => {
    if (a.merkmal && !kann(a.merkmal)) return;   /* harte Regel 9 */
    knopf(a.inhalt, a.titel, () => auszeichnen(a.zeichen));
  });
}

function leisteVerbergen(){ $("#leiste").classList.remove("an"); }

function leistePruefen(){
  const l = $("#leiste");
  if ($("#app").dataset.ansicht === "quelltext"
      || $("#einstellungen").classList.contains("an")){ leisteVerbergen(); return; }
  const a = auswahlLesen();
  if (!a){ leisteVerbergen(); return; }
  leisteBauen();
  l.classList.add("an");
  const b = l.getBoundingClientRect();
  let links = a.rechteck.left + a.rechteck.width / 2 - b.width / 2;
  links = Math.max(8, Math.min(links, innerWidth - b.width - 8));
  /* In der ersten Zeile ist oben kein Platz — dann darunter. Notion
     tut dasselbe, und es ist mehr Aufwand, als es aussieht. */
  let oben = a.rechteck.top - b.height - 8;
  if (oben < 8) oben = a.rechteck.bottom + 8;
  l.style.left = Math.round(links) + "px";
  l.style.top  = Math.round(oben) + "px";
}

/* ---------- Die Blockarten ----------
   Eine Liste für alles, was eine Blockart auswählbar macht:
   Blockmenü, Umwandeln, später das Slash-Menü. Das Kürzel steht
   überall daneben — wer das Menü zweimal benutzt hat, tippt beim
   dritten Mal die zwei Zeichen und braucht es nicht mehr. */
const ARTEN = [
  {art:"absatz", name:"Text",              zeichen:"¶",   kuerzel:"",
   probe:"Ein einfacher Absatz."},
  {art:"h1",     name:"Überschrift 1",     zeichen:"H1",  kuerzel:"# ",
   probe:"# 2 Zielbild"},
  {art:"h2",     name:"Überschrift 2",     zeichen:"H2",  kuerzel:"## ",
   probe:"## 2 Zielbild"},
  {art:"h3",     name:"Überschrift 3",     zeichen:"H3",  kuerzel:"### ",
   probe:"### 2 Zielbild"},
  {art:"punkt",  name:"Aufzählung",        zeichen:"•",   kuerzel:"- ",
   probe:"- Erster Punkt"},
  {art:"nummer", name:"Nummerierte Liste", zeichen:"1.",  kuerzel:"1. ",
   probe:"1. Erster Punkt"},
  {art:"todo",   name:"To-do-Liste",       zeichen:"[ ]", kuerzel:"- [ ] ", merkmal:"todo",
   urteil:"GFM", probe:"- [ ] Berichte sichten\n- [x] Erledigtes"},
  {art:"zitat",  name:"Zitat",             zeichen:"»",   kuerzel:"> ",
   probe:"> Ein abgesetzter Satz."},
  {art:"code",   name:"Codeblock",         zeichen:"```", kuerzel:"```",
   probe:"```javascript\nconst n = 1;\n```"},
  {art:"linie",  name:"Trennlinie",        zeichen:"—",   kuerzel:"---",
   probe:"---"},
  /* Die drei jenseits von reinem Markdown. `vorlage` baut die Quelle,
     wenn ein Block in diese Art umgewandelt wird — sie tragen ihre
     ganze Quelle im Feld `text` und wären ohne Gerüst unlesbar. */
  {art:"tabelle", name:"Tabelle",          zeichen:"|",   kuerzel:"| |",
   merkmal:"tabelle", urteil:"GFM",
   probe:"| Name | Format |\n| --- | --- |\n| Export | CSV |",
   vorlage:(t) => "| " + (t || "Spalte") + " | Spalte |\n| --- | --- |\n|  |  |"},
  {art:"callout", name:"Callout",          zeichen:"!",   kuerzel:"> [!TIP]",
   merkmal:"callout", urteil:"Dialekt",
   probe:"> [!TIP]\n> Vier davon sind derselbe Export.",
   vorlage:(t) => "> [!NOTE]\n> " + (t || "Hinweis")},
  {art:"toggle",  name:"Toggle-Liste",     zeichen:"›",   kuerzel:"<details>",
   merkmal:"html", urteil:"HTML",
   probe:"<details>\n<summary>Entscheidungen</summary>\n\nDer Rumpf.\n\n</details>",
   vorlage:(t) => "<details>\n<summary>" + (t || "Titel") + "</summary>\n\n\n\n</details>"},
  /* Kein Blockart, sondern ein Handgriff: Er fragt nach dem Pfad und
     schreibt den Verweis. Deshalb steht er nur im Slash-Menü —
     „Umwandeln in Bild" ergäbe keinen Sinn. */
  {art:"bild",    name:"Bild",             zeichen:"[]",  kuerzel:"![ ]( )",
   nurSlash:true, probe:"![Das Raster](./bilder/raster.png)",
   tue:bildEinfuegen}
];

/* Was die gewählte Stufe nicht kann, steht nicht im Menü — harte
   Regel 9. Was schon im Text steht, bleibt davon unberührt. */
function arten(){ return ARTEN.filter(a => !a.merkmal || kann(a.merkmal)); }

/* Die Urteile aus doku/BLOCKKATALOG.md, in einem Satz. */
const URTEIL_SATZ = {
  "rein":    "Läuft in jedem Werkzeug der Welt.",
  "GFM":     "GitHub-Markdown. Sehr verbreitet, aber eine Erweiterung.",
  "Dialekt": "Bindet die Datei an Werkzeuge, die diesen Dialekt kennen.",
  "HTML":    "Gültiges Markdown — im nächsten Editor aber rohes HTML statt eines Blocks."
};

function umwandeln(i, art){
  const b = Z.bloecke[i];
  if (b.art === art) return;
  b.art = art;
  if (art === "todo"){ if (b.fertig === undefined) b.fertig = false; }
  else delete b.fertig;
  if (art !== "code") delete b.sprache;
  if (LISTE.indexOf(art) < 0) delete b.tiefe;   /* nur Listen sind eingerückt */
  if (art === "linie") b.text = "";
  const eintrag = ARTEN.find(a => a.art === art);
  if (eintrag && eintrag.vorlage) b.text = eintrag.vorlage(b.text.split("\n")[0]);
  bewahre(); male(i, -1);
}

/* ---------- Menüs ---------- */
function menueVerbergen(){ $("#menue").classList.remove("an"); }

/* `eintraege` ist eine Liste aus {ic, nm, ta, tue} und "tr" für einen
   Trenner, "k:Überschrift" für eine Gruppenzeile. */
function menueZeigen(eintraege, anker){
  const m = $("#menue");
  m.innerHTML = "";
  eintraege.forEach(e => {
    if (e === "tr"){ m.appendChild(el("div", "tr")); return; }
    if (typeof e === "string" && e.slice(0,2) === "k:"){
      m.appendChild(el("div", "k", esc(e.slice(2)))); return; }
    const b = el("button", null,
      '<span class="ic">' + esc(e.ic || "") + '</span>'
      + '<span class="nm">' + esc(e.nm) + '</span>'
      + (e.ta ? '<span class="ta">' + esc(e.ta) + '</span>' : ""));
    b.type = "button";
    b.setAttribute("role", "menuitem");
    b.onclick = () => { menueVerbergen(); e.tue(); };
    m.appendChild(b);
  });
  m.classList.add("an");
  const r = anker.getBoundingClientRect(), g = m.getBoundingClientRect();
  let links = Math.min(r.left, innerWidth - g.width - 8);
  let oben  = r.bottom + 6;
  if (oben + g.height > innerHeight - 8) oben = Math.max(8, r.top - g.height - 6);
  m.style.left = Math.round(Math.max(8, links)) + "px";
  m.style.top  = Math.round(oben) + "px";
}

function blockMenue(i, anker){
  const b = Z.bloecke[i];
  if (!b) return;
  const eintraege = [
    {ic:"", nm:"Löschen", ta:"Entf", tue:() => {
      Z.bloecke.splice(i, 1);
      if (!Z.bloecke.length) Z.bloecke.push({art:"absatz", text:""});
      bewahre(); male(Math.max(0, i-1), -1);
      melde("Block gelöscht");
    }},
    {ic:"", nm:"Duplizieren", ta:"Strg D", tue:() => {
      Z.bloecke.splice(i + 1, 0, JSON.parse(JSON.stringify(b)));
      bewahre(); male(i + 1, -1);
    }},
    "tr", "k:Umwandeln in"
  ];
  arten().filter(a => !a.nurSlash).forEach(a => eintraege.push(
    {ic:a.zeichen, nm:a.name + (a.urteil ? "  · " + a.urteil : ""),
     ta:a.kuerzel.trim(), tue:() => umwandeln(i, a.art)}));
  menueZeigen(eintraege, anker);
}

/* ---------- Das Slash-Menü ----------
   `/` am Blockanfang öffnet die Liste, Weitertippen filtert. Rechts
   in jeder Zeile das Markdown-Kürzel: Wer das Menü zweimal benutzt
   hat, tippt beim dritten Mal die zwei Zeichen. Das Menü ist damit
   nebenbei ein Lehrmittel — und macht sich mit der Zeit selbst
   überflüssig.

   Es zeigt nur, was gebaut **und** auf der gewählten Stufe möglich
   ist. Ein Menü, das etwas anbietet, was beim Klick nicht kommt, ist
   schlimmer als eines, das schweigt. */
let slashBlock = -1, slashWahl = 0, slashTreffer = [];

function slashOffen(){ return slashBlock >= 0; }

function slashSchliessen(){
  slashBlock = -1;
  $("#slash").classList.remove("an");
}

/* Der Suchbegriff steht im Block selbst: alles hinter dem `/`. */
function slashBegriff(i){
  const b = Z.bloecke[i];
  if (!b || MEHRZEILIG.indexOf(b.art) >= 0) return null;
  const m = b.text.match(/^\/([^\s]*)$/);
  return m ? m[1] : null;
}

function slashMalen(){
  const begriff = slashBegriff(slashBlock);
  if (begriff === null){ slashSchliessen(); return; }
  const suche = begriff.toLowerCase();
  slashTreffer = arten().filter(a =>
    !suche || (a.name + " " + a.kuerzel + " " + a.art).toLowerCase().indexOf(suche) >= 0);
  if (slashWahl >= slashTreffer.length) slashWahl = 0;

  const liste = $("#slash-liste");
  liste.innerHTML = "";
  if (!slashTreffer.length){
    liste.appendChild(el("div", "leer", "Kein Block heißt so."));
  }
  slashTreffer.forEach((a, k) => {
    const b = el("button", k === slashWahl ? "zeig" : null,
      '<span class="ic">' + esc(a.zeichen) + '</span>'
      + '<span class="nm">' + esc(a.name) + '</span>'
      + (a.kuerzel.trim() ? '<span class="ta">' + esc(a.kuerzel.trim()) + '</span>' : ""));
    b.type = "button";
    b.setAttribute("role", "option");
    b.setAttribute("aria-selected", String(k === slashWahl));
    /* `mousedown` statt `click`: Beim Klick wäre der Block schon aus
       dem Fokus, und die Auswahl liefe ins Leere. */
    b.addEventListener("mousedown", (ev) => { ev.preventDefault(); slashWaehlen(k); });
    b.addEventListener("mousemove", () => {
      if (slashWahl === k) return;
      slashWahl = k; slashMalen();
    });
    liste.appendChild(b);
  });

  const a = slashTreffer[slashWahl];
  const v = $("#slash-vorschau");
  if (!a){ v.innerHTML = ""; }
  else {
    const urteil = a.urteil || "rein";
    v.innerHTML = '<div class="k">Was in die Datei kommt</div>'
      + "<pre>" + esc(a.probe || "") + "</pre>"
      + '<span class="ur">' + esc(urteil) + "</span>"
      + '<div class="satz">' + esc(URTEIL_SATZ[urteil] || "") + "</div>";
  }

  const knoten = $('.blk[data-i="' + slashBlock + '"]');
  if (!knoten){ slashSchliessen(); return; }
  const m = $("#slash");
  m.classList.add("an");
  const r = knoten.getBoundingClientRect(), g = m.getBoundingClientRect();
  let links = Math.min(r.left, innerWidth - g.width - 8);
  let oben = r.bottom + 6;
  if (oben + g.height > innerHeight - 8) oben = Math.max(8, r.top - g.height - 6);
  m.style.left = Math.round(Math.max(8, links)) + "px";
  m.style.top  = Math.round(oben) + "px";
}

function slashWaehlen(k){
  const a = slashTreffer[k], i = slashBlock;
  if (!a || i < 0) return;
  slashSchliessen();
  const b = Z.bloecke[i];
  b.text = "";                       /* der Suchbegriff war nie Inhalt */
  if (a.tue){ aktiv = i; male(i, 0); a.tue(i); return; }
  if (b.art === a.art){ bewahre(); male(i, -1); }
  else umwandeln(i, a.art);
}

/* Gibt `true` zurück, wenn die Taste zum Menü gehörte. */
function slashTaste(ev){
  if (!slashOffen()) return false;
  if (ev.key === "Escape"){ ev.preventDefault(); slashSchliessen(); return true; }
  if (ev.key === "ArrowDown" || ev.key === "ArrowUp"){
    ev.preventDefault();
    if (!slashTreffer.length) return true;
    slashWahl = (slashWahl + (ev.key === "ArrowDown" ? 1 : -1) + slashTreffer.length)
              % slashTreffer.length;
    slashMalen();
    return true;
  }
  if (ev.key === "Enter" || ev.key === "Tab"){
    if (!slashTreffer.length) return false;
    ev.preventDefault(); slashWaehlen(slashWahl); return true;
  }
  return false;
}

/* ---------- Ereignisse an der Fläche ---------- */
function verdrahte(){
  const spalte = $("#spalte");

  /* Vor dem Klick auf den Rohtext umstellen: `mousedown` kommt vor dem
     Setzen der Schreibmarke, `focus` erst danach. Andersherum spränge
     die Marke bei jedem Klick an den Anfang. */
  spalte.addEventListener("mousedown", (ev) => {
    const blk = ev.target.closest(".blk");
    if (!blk || ev.target.closest(".griff") || ev.target.closest(".kasten")) return;
    const i = Number(blk.dataset.i);
    if (i === aktiv) return;
    if (aktiv >= 0 && Z.bloecke[aktiv]){
      const alt = textVon(aktiv);
      if (alt) alt.innerHTML = blockInhalt(Z.bloecke[aktiv]);
    }
    aktiv = i;
    const t = blk.querySelector(".txt");
    if (t) t.textContent = Z.bloecke[i].text;
  });

  spalte.addEventListener("focusin", (ev) => {
    const t = ev.target.closest(".txt"); if (!t) return;
    const i = Number(t.closest(".blk").dataset.i);
    if (aktiv !== i){
      if (aktiv >= 0 && Z.bloecke[aktiv]){
        const alt = textVon(aktiv);
        if (alt) alt.innerHTML = blockInhalt(Z.bloecke[aktiv]);
      }
      aktiv = i;
      t.textContent = Z.bloecke[i].text;
    }
    t.closest(".blk").classList.add("ueber");
  });

  spalte.addEventListener("focusout", (ev) => {
    const t = ev.target.closest(".txt"); if (!t) return;
    const blk = t.closest(".blk"); if (!blk) return;
    blk.classList.remove("ueber");
    const i = Number(blk.dataset.i);
    if (slashBlock === i) slashSchliessen();
    if (Z.bloecke[i]) t.innerHTML = blockInhalt(Z.bloecke[i]);
    if (aktiv === i) aktiv = -1;
  });

  spalte.addEventListener("input", (ev) => {
    const t = ev.target.closest(".txt"); if (!t) return;
    const i = Number(t.closest(".blk").dataset.i);
    if (!Z.bloecke[i]) return;
    Z.bloecke[i].text = t.textContent;
    if (hilfePruefen(i, t)) return;
    if (slashOffen()) slashMalen();
    else if (Z.bloecke[i].text === "/"){ slashBlock = i; slashWahl = 0; slashMalen(); }
    bewahre();
    quelleMalen();
    fussMalen();
  });

  spalte.addEventListener("keydown", (ev) => {
    const t = ev.target.closest(".txt"); if (!t) return;
    if (slashTaste(ev)) return;             /* das offene Menü hat Vorrang */
    tasteImBlock(ev, Number(t.closest(".blk").dataset.i), t);
  });

  /* Eingefügter Text kommt als Markdown herein und wird gedeutet —
     sonst landet eine kopierte Liste als ein einziger Absatz. */
  spalte.addEventListener("paste", (ev) => {
    const t = ev.target.closest(".txt"); if (!t) return;
    const roh = (ev.clipboardData || window.clipboardData).getData("text/plain");
    if (!roh || roh.indexOf("\n") < 0) return;            /* einzeilig: normal einfügen */
    ev.preventDefault();
    const i = Number(t.closest(".blk").dataset.i);
    const neu = leseMarkdown(roh);
    const pos = holePos(t);
    const rest = Z.bloecke[i].text.slice(pos);
    Z.bloecke[i].text = Z.bloecke[i].text.slice(0, pos);
    const ab = i + 1;
    Z.bloecke.splice(ab, 0, ...neu);
    if (rest) Z.bloecke.splice(ab + neu.length, 0, {art:"absatz", text:rest});
    bewahre(); male(ab + neu.length - 1, -1);
    melde(neu.length + (neu.length === 1 ? " Block eingefügt" : " Blöcke eingefügt"));
  });

  /* ---------- Ziehen ---------- */
  spalte.addEventListener("dragstart", (ev) => {
    const blk = ev.target.closest(".blk"); if (!blk) return;
    ziehtVon = Number(blk.dataset.i);
    ev.dataTransfer.effectAllowed = "move";
    ev.dataTransfer.setData("text/plain", String(ziehtVon));
  });
  spalte.addEventListener("dragover", (ev) => {
    if (ziehtVon < 0) return;
    const blk = ev.target.closest(".blk"); if (!blk) return;
    ev.preventDefault();
    const r = blk.getBoundingClientRect();
    const unten = ev.clientY > r.top + r.height / 2;
    spalte.querySelectorAll(".blk").forEach(x => x.classList.remove("zielvor","zielnach"));
    blk.classList.add(unten ? "zielnach" : "zielvor");
  });
  spalte.addEventListener("drop", (ev) => {
    if (ziehtVon < 0) return;
    const blk = ev.target.closest(".blk"); if (!blk) return;
    ev.preventDefault();
    const r = blk.getBoundingClientRect();
    const unten = ev.clientY > r.top + r.height / 2;
    let ziel = Number(blk.dataset.i) + (unten ? 1 : 0);
    const stueck = Z.bloecke[ziehtVon];
    Z.bloecke.splice(ziehtVon, 1);
    if (ziehtVon < ziel) ziel--;
    Z.bloecke.splice(ziel, 0, stueck);
    ziehtVon = -1;
    bewahre(); male();
    melde("Verschoben");
  });
  spalte.addEventListener("dragend", () => {
    ziehtVon = -1;
    spalte.querySelectorAll(".blk").forEach(x => {
      x.classList.remove("zielvor","zielnach"); x.draggable = false; });
  });

  /* Ein Klick unter den letzten Block hängt einen neuen an — dieselbe
     Erwartung wie in jedem Textfeld. */
  $("#blatt").addEventListener("mousedown", (ev) => {
    if (ev.target !== $("#blatt") && ev.target !== $("#spalte")) return;
    const letzter = Z.bloecke[Z.bloecke.length-1];
    if (letzter && letzter.art === "absatz" && !letzter.text){
      setzeFokus(Z.bloecke.length-1, 0); return; }
    Z.bloecke.push({art:"absatz", text:""});
    bewahre(); male(Z.bloecke.length-1, 0);
  });

  /* ---------- Die Leiste ---------- */
  /* `selectionchange` feuert bei jedem Zeichen. Ein Bild Abstand
     genügt: Die Leiste muss nicht schneller sein als das Auge. */
  let leistenUhr = null;
  document.addEventListener("selectionchange", () => {
    cancelAnimationFrame(leistenUhr);
    leistenUhr = requestAnimationFrame(leistePruefen);
  });
  /* Ein Klick auf die Leiste darf die Auswahl nicht löschen — sonst
     wäre beim Loslassen nichts mehr da, worauf der Knopf wirken kann. */
  $("#leiste").addEventListener("mousedown", (ev) => ev.preventDefault());
  $("#blatt").addEventListener("scroll", () => { leisteVerbergen(); menueVerbergen(); },
    {passive:true});
  document.addEventListener("mousedown", (ev) => {
    if (!ev.target.closest("#menue") && !ev.target.closest(".griff")) menueVerbergen();
  });
}

/* ============================================================
   7 — DER QUELLTEXT

   In der geteilten Ansicht ist er nur zu lesen, in der Ansicht
   „Quelltext" zu schreiben. Zwei schreibbare Stände nebeneinander
   wären zwei Wahrheiten — die Begründung steht in
   doku/ENTSCHEIDUNGEN.md, Punkt 3.
   ============================================================ */
function quelltextVerdrahten(){
  const q = $("#q");
  q.addEventListener("input", () => {
    if (q.readOnly) return;
    ersetze(Z.bloecke, leseMarkdown(q.value));
    bewahre();
    fussMalen();
  });
  q.addEventListener("blur", () => { if (!q.readOnly) male(); });
}

function ansicht(name){
  leisteVerbergen();
  $("#app").dataset.ansicht = name;
  ["schreiben","geteilt","quelltext"].forEach(n =>
    $("#w-" + n).setAttribute("aria-current", String(n === name)));
  if (name !== "quelltext") male(); else quelleMalen();
  try { localStorage.setItem(SCHLUESSEL + "-ansicht", name); } catch (e) { /* egal */ }
}

/* ============================================================
   8 — GLIEDERUNG UND SUCHEN

   Beides beantwortet dieselbe Frage — wo bin ich, und wo ist das,
   was ich suche. Der Dateibaum aus dem Entwurf beantwortet sie
   nicht; er ist gestrichen (doku/ENTSCHEIDUNGEN.md, Punkt 2).
   ============================================================ */
function gliederungMalen(){
  const liste = $("#g-liste");
  liste.innerHTML = "";
  const kopf = [];
  Z.bloecke.forEach((b, i) => { if (/^h[123]$/.test(b.art)) kopf.push({b:b, i:i}); });
  if (!kopf.length){
    liste.appendChild(el("div", "leer",
      "Noch keine Überschriften. Tippe <code>## </code> am Zeilenanfang."));
    return;
  }
  kopf.forEach(({b, i}) => {
    const grad = b.art.slice(1);
    const z = el("button", "z s" + grad, esc(b.text || "(ohne Text)"));
    z.type = "button";
    z.title = b.text;
    z.onclick = () => {
      const knoten = $('.blk[data-i="' + i + '"]');
      if (knoten) knoten.scrollIntoView({block:"center"});
      setzeFokus(i, 0);
    };
    liste.appendChild(z);
  });
}

/* GitHubs Ankerform: klein geschrieben, Satzzeichen raus, Leerzeichen
   zu Strichen. Buchstaben mit Umlaut bleiben — sie sind Buchstaben. */
const anker = (t) => String(t || "").toLowerCase().trim()
  .replace(/[^\p{L}\p{N} _-]/gu, "").replace(/\s+/g, "-");

function inhaltEinfuegen(){
  const kopf = [];
  Z.bloecke.forEach((b, i) => { if (/^h[123]$/.test(b.art) && b.text) kopf.push(b); });
  if (!kopf.length){ melde("Keine Überschriften — nichts zu verzeichnen."); return; }
  /* Reine Verweise, keine Sonderschreibweise: Das Verzeichnis ist
     hinterher gewöhnlicher Markdown-Text und lässt sich von Hand
     ändern wie jede andere Liste. */
  const flach = Math.min.apply(null, kopf.map(b => Number(b.art.slice(1))));
  const zeilen = kopf.map(b =>
    "  ".repeat(Number(b.art.slice(1)) - flach) + "- [" + b.text + "](#" + anker(b.text) + ")");
  const neu = leseMarkdown(zeilen.join("\n"));
  /* Hinter die erste Überschrift, sonst ganz nach oben — dort sucht
     man ein Inhaltsverzeichnis. */
  let wo = 0;
  for (let i = 0; i < Z.bloecke.length; i++){
    if (/^h[123]$/.test(Z.bloecke[i].art)){ wo = i + 1; break; }
  }
  Z.bloecke.splice(wo, 0, ...neu);
  bewahre(); male(wo, 0);
  melde(neu.length + " Überschriften als Verzeichnis eingefügt");
}

/* ---------- Suchen ---------- */
let suchWort = "", suchStellen = [], suchWahl = 0;

function suchRechnen(){
  suchStellen = [];
  if (!suchWort) return;
  const wort = suchWort.toLowerCase();
  Z.bloecke.forEach((b, i) => {
    const t = String(b.text || "").toLowerCase();
    let k = t.indexOf(wort);
    while (k >= 0){ suchStellen.push({i:i, pos:k}); k = t.indexOf(wort, k + wort.length); }
  });
  if (suchWahl >= suchStellen.length) suchWahl = 0;
}

function suchZahlMalen(){
  $("#such-zahl").textContent = !suchWort ? ""
    : suchStellen.length ? (suchWahl + 1) + " von " + suchStellen.length
    : "kein Fund";
}

/* Die Funde werden **im Baum** markiert, nicht im HTML-Text: Ein
   Ersetzen auf der Zeichenkette träfe sonst auch das, was in einem
   Attribut oder Elementnamen steht. */
function fundeMarkieren(knoten, wort){
  const suche = wort.toLowerCase();
  const gehe = (n) => {
    if (n.nodeType === 3){
      const t = n.nodeValue, k = t.toLowerCase().indexOf(suche);
      if (k < 0) return;
      const treffer = n.splitText(k);
      treffer.splitText(wort.length);
      const m = document.createElement("em");
      m.className = "fund";
      m.textContent = treffer.nodeValue;
      treffer.parentNode.replaceChild(m, treffer);
      gehe(m.nextSibling);                    /* der Rest der Zeile */
      return;
    }
    if (n && n.nodeType === 1 && n.className !== "fund")
      Array.prototype.slice.call(n.childNodes).forEach(gehe);
  };
  Array.prototype.slice.call(knoten.childNodes).forEach(gehe);
}

function fundeZeigen(){
  if (!suchWort) return;
  $("#spalte").querySelectorAll(".blk").forEach(n => {
    if (Number(n.dataset.i) === aktiv) return;   /* dort steht Rohtext */
    const t = n.querySelector(".txt");
    if (t) fundeMarkieren(t, suchWort);
  });
}

function suchSpringen(k){
  if (!suchStellen.length) return;
  suchWahl = (k + suchStellen.length) % suchStellen.length;
  const st = suchStellen[suchWahl];
  const knoten = $('.blk[data-i="' + st.i + '"]');
  if (knoten) knoten.scrollIntoView({block:"center"});
  setzeFokus(st.i, st.pos);
  suchZahlMalen();
}

function suchenVerdrahten(){
  const kasten = $("#suchen"), feld = $("#such-feld");
  const zu = () => {
    kasten.classList.remove("an");
    suchWort = ""; suchStellen = []; suchZahlMalen(); male();
  };
  $("#such-zu").onclick = zu;
  $("#such-vor").onclick = () => suchSpringen(suchWahl + 1);
  $("#such-zurueck").onclick = () => suchSpringen(suchWahl - 1);
  feld.addEventListener("input", () => {
    suchWort = feld.value; suchWahl = 0;
    suchRechnen(); suchZahlMalen();
    const merk = aktiv; aktiv = -1; male(); aktiv = merk;
  });
  feld.addEventListener("keydown", (ev) => {
    if (ev.key === "Escape"){ ev.preventDefault(); zu(); return; }
    if (ev.key === "Enter"){
      ev.preventDefault();
      suchSpringen(suchWahl + (ev.shiftKey ? -1 : 1));
      feld.focus();
    }
  });
  return () => {
    kasten.classList.add("an");
    feld.select(); feld.focus();
  };
}

/* ============================================================
   9 — EINSTELLUNGEN

   Bisher steht hier nur die Markdown-Stufe. Sie gehört in die
   Einstellungen und nicht in den Code: Dieselbe Fläche, andere
   Ausgabe — doku/ENTSCHEIDUNGEN.md, Punkt 1.
   ============================================================ */
const THEMEN = [
  ["hell",   "Hell",   "Die Vorgabe. Heller Grund, dunkle Schrift."],
  ["dunkel", "Dunkel",
   "Dunkler Grund. <b>Der Druck bleibt davon unberührt</b> — Papier ist weiß, und "
   + "eine dunkle Fläche darauf kostet nur Farbe."]
];

const SATZARTEN = [
  ["links",     "Flattersatz",
   "Die Vorgabe. Gleiche Wortabstände, ausgefranster rechter Rand."],
  ["blocksatz", "Blocksatz",
   "Beide Ränder bündig. In einer schmalen Spalte entstehen dabei Lücken zwischen den "
   + "Wörtern — der Browser trennt nur, wo die Sprache es erlaubt. "
   + "<b>In der Datei steht davon nichts.</b>"]
];

const DRUCKARTEN = [
  ["schlicht",   "Schlicht",
   "Die Vorgabe. Nüchtern, wenig Zierrat, spart Papier."],
  ["technik",    "Technische Doku",
   "Enger Satz, gerahmte Codeblöcke, Tabellen mit Linien, jede Überschrift 1 auf einer "
   + "neuen Seite. <b>Nummeriert die Überschriften selbst</b> — bei Texten, die ihre "
   + "Nummer schon im Titel tragen, doppelt das."],
  ["manuskript", "Manuskript",
   "Weiter Durchschuss und ein breiter Rand zum Hineinschreiben. Für Entwürfe, die auf "
   + "Papier bearbeitet werden."]
];

/* Vier Gruppen, ein Bauplan. `wurzel` heißt: Die Einstellung steht als
   Merkmal am Wurzelelement, und der Stil richtet sich danach — dann
   braucht es kein Neuzeichnen. Die Stufe dagegen ändert, was der
   Editor **anzeigt**, und verlangt eines. */
const EINSTELLUNGEN = [
  {feld:"stufe", etikett:"Markdown-Stufe",   werte:STUFEN,     malen:true},
  {feld:"thema", etikett:"Thema",            werte:THEMEN,     wurzel:true},
  {feld:"satz",  etikett:"Textausrichtung",  werte:SATZARTEN,  wurzel:true},
  {feld:"druck", etikett:"Druck-Layout",     werte:DRUCKARTEN, wurzel:true}
];

function wurzelSetzen(){
  const w = document.documentElement;
  w.dataset.thema = Z.thema;
  w.dataset.satz  = Z.satz;
  w.dataset.druck = Z.druck;
}

function einstellungenMalen(){
  const ziel = $("#ein-gruppen");
  ziel.innerHTML = "";
  EINSTELLUNGEN.forEach(g => {
    const kasten = el("div", "gruppe");
    kasten.appendChild(el("div", "etikett", esc(g.etikett)));
    const wahl = el("div", "wahl");
    wahl.setAttribute("role", "group");
    wahl.setAttribute("aria-label", g.etikett);
    g.werte.forEach(([schluessel, name]) => {
      const b = el("button", null, esc(name));
      b.type = "button";
      b.setAttribute("aria-pressed", String(schluessel === Z[g.feld]));
      b.onclick = () => {
        if (schluessel === Z[g.feld]) return;
        Z[g.feld] = schluessel;
        bewahreSofort();
        if (g.wurzel) wurzelSetzen();
        einstellungenMalen();
        if (g.malen) male();
        melde(g.etikett + ": " + name);
      };
      wahl.appendChild(b);
    });
    kasten.appendChild(wahl);
    const jetzt = g.werte.find(x => x[0] === Z[g.feld]);
    kasten.appendChild(el("div", "erklaerung", jetzt ? jetzt[2] : ""));
    ziel.appendChild(kasten);
  });
}

function einstellungenVerdrahten(){
  const ueber = $("#einstellungen");
  const zu = () => ueber.classList.remove("an");
  $("#ein-auf").onclick = () => {
    einstellungenMalen(); ueber.classList.add("an"); $("#ein-zu").focus(); };
  $("#ein-zu").onclick = zu;
  /* Ein Klick daneben schließt, ein Klick auf die Karte nicht. */
  ueber.addEventListener("mousedown", (ev) => { if (ev.target === ueber) zu(); });
  document.addEventListener("keydown", (ev) => {
    if (ev.key !== "Escape") return;
    if (ueber.classList.contains("an")) zu();
    menueVerbergen(); leisteVerbergen(); slashSchliessen();
  });
}

/* ============================================================
  10 — DATEIEN

   Edge erlaubt aus einer lokal geöffneten Datei **keinen** direkten
   Dateizugriff; die File System Access API ist damit keine Option.
   Geöffnet wird über die Dateiauswahl, gesichert über den Download.
   Der Arbeitsstand liegt dazwischen in localStorage.
   ============================================================ */
function dateienVerdrahten(){
  $("#oeffnen").onclick = () => $("#datei").click();
  $("#datei").addEventListener("change", (ev) => {
    const f = ev.target.files && ev.target.files[0];
    if (!f) return;
    const leser = new FileReader();
    leser.onload = () => {
      Z.name = f.name;
      ersetze(Z.bloecke, leseMarkdown(String(leser.result)));
      aktiv = -1;
      bewahre(); male();
      melde("Geöffnet: " + f.name + " — " + Z.bloecke.length + " Blöcke");
    };
    leser.onerror = () => melde("Die Datei ließ sich nicht lesen.");
    leser.readAsText(f, "utf-8");
    ev.target.value = "";                 /* dieselbe Datei nochmal öffnen können */
  });

  $("#sichern").onclick = () => {
    const text = schreibeMarkdown(Z.bloecke);
    const blob = new Blob([text], {type:"text/markdown;charset=utf-8"});
    const a = el("a");
    const adresse = URL.createObjectURL(blob);
    a.href = adresse;
    a.download = /\.(md|markdown|txt)$/i.test(Z.name) ? Z.name : Z.name + ".md";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(adresse), 4000);
    melde("Gesichert: " + a.download);
  };

  /* Der Browser kann aus jedem Druck ein PDF machen — „Als PDF
     speichern" steht in seinem eigenen Dialog. Das Layout dafür
     liefert der Druckstil; ein eigener Erzeuger wäre eine fremde
     Bibliothek und ist ausgeschlossen (doku/ENTSCHEIDUNGEN.md,
     Punkt 10). */
  $("#pdf").onclick = () => {
    leisteVerbergen(); menueVerbergen(); slashSchliessen();
    melde("Im Druckdialog „Als PDF speichern“ wählen.");
    setTimeout(() => window.print(), 260);
  };

  $("#neu").onclick = () => {
    if (schreibeMarkdown(Z.bloecke).trim()
        && !confirm("Der jetzige Text geht verloren.\n\nOK = neu anfangen, Abbrechen = zurück"))
      return;
    Z.name = "unbenannt.md";
    ersetze(Z.bloecke, [{art:"absatz", text:""}]);
    aktiv = -1; bewahre(); male(0, 0);
  };

  $("#name").onclick = () => {
    const n = prompt("Dateiname", Z.name);
    if (!n) return;
    Z.name = /\.(md|markdown|txt)$/i.test(n) ? n : n + ".md";
    bewahre(); fussMalen(); quelleMalen();
  };
}

/* ============================================================
  11 — TASTATUR UND START
   ============================================================ */
document.addEventListener("keydown", (ev) => {
  if (!(ev.ctrlKey || ev.metaKey)) return;
  const k = ev.key.toLowerCase();
  if (k === "s"){ ev.preventDefault(); $("#sichern").click(); }
  if (k === "o"){ ev.preventDefault(); $("#oeffnen").click(); }
  /* Ohne diese drei setzt das Textfeld von sich aus <b>, <i> und <u>
     in den Block — und schriebe damit HTML, wo Markdown stehen soll. */
  /* Ohne preventDefault nimmt das Textfeld selbst zurück — und zwar
     einen Stand, den es aus dem Neuzeichnen von `male()` nie richtig
     mitbekommen hat. */
  if (k === "z" && !ev.shiftKey){ ev.preventDefault(); zurueck(); return; }
  if (k === "y" || (k === "z" && ev.shiftKey)){ ev.preventDefault(); wieder(); return; }
  if (k === "d" && aktiv >= 0 && Z.bloecke[aktiv]){
    ev.preventDefault();
    Z.bloecke.splice(aktiv + 1, 0, JSON.parse(JSON.stringify(Z.bloecke[aktiv])));
    bewahre(); male(aktiv + 1, -1);
  }
  if (k === "b"){ ev.preventDefault(); auszeichnen("**"); }
  if (k === "i"){ ev.preventDefault(); auszeichnen("*"); }
  if (k === "u"){
    ev.preventDefault();
    melde("Markdown kennt kein Unterstreichen. Fett: Strg B, kursiv: Strg I.");
  }
  if (k === "e"){
    ev.preventDefault();
    ansicht($("#app").dataset.ansicht === "schreiben" ? "geteilt" : "schreiben");
  }
});

const START = "# Willkommen\n\n"
  + "Dies ist ein **Gerüst**, kein fertiger Editor. Was schon geht und was noch\n"
  + "fehlt, steht in `STAND.md`; wie es aussehen soll, in `mockups/`.\n\n"
  + "## Was hier schon funktioniert\n\n"
  + "- [x] Blöcke aus Markdown lesen und wieder als Markdown schreiben\n"
  + "- [x] Eingabehilfen: `# `, `- `, `1. `, `- [ ] `, `> ` und `---`\n"
  + "- [x] Der Block unter der Schreibmarke zeigt seinen Rohtext\n"
  + "- [ ] Slash-Menü, Auswahlleiste, Umwandeln — Schritt 2 und 3\n\n"
  + "> Der Text ist immer Rohtext. Gespeichert wird nie etwas anderes als Markdown.\n\n"
  + "```javascript\n"
  + "const bloecke = leseMarkdown(text);\n"
  + "console.assert(schreibeMarkdown(bloecke) === text);\n"
  + "```\n\n"
  + "---\n\n"
  + "Ziehe einen Block am Griff links, um ihn zu verschieben.\n";

function start(){
  if (!lade()) ersetze(Z.bloecke, leseMarkdown(START));
  verdrahte();
  quelltextVerdrahten();
  dateienVerdrahten();
  einstellungenVerdrahten();
  const suchenOeffnen = suchenVerdrahten();
  $("#g-inhalt").onclick = inhaltEinfuegen;
  $("#g-auf").onclick = () => {
    const app = $("#app");
    const aus = app.dataset.gliederung === "aus";
    app.dataset.gliederung = aus ? "an" : "aus";
    $("#g-auf").setAttribute("aria-pressed", String(aus));
    try { localStorage.setItem(SCHLUESSEL + "-gliederung", app.dataset.gliederung); }
    catch (e) { /* egal */ }
  };
  try {
    $("#app").dataset.gliederung = localStorage.getItem(SCHLUESSEL + "-gliederung") || "an";
  } catch (e) { $("#app").dataset.gliederung = "an"; }
  $("#g-auf").setAttribute("aria-pressed",
    String($("#app").dataset.gliederung !== "aus"));
  document.addEventListener("keydown", (ev) => {
    if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "f"){
      ev.preventDefault(); suchenOeffnen();
    }
  });
  ["schreiben","geteilt","quelltext"].forEach(n => {
    $("#w-" + n).onclick = () => ansicht(n); });
  let gemerkt = "schreiben";
  try { gemerkt = localStorage.getItem(SCHLUESSEL + "-ansicht") || "schreiben"; }
  catch (e) { /* egal */ }
  wurzelSetzen();
  ansicht(gemerkt);
  merken();                 /* der Anfangsstand, sonst führt das erste Rückgängig ins Leere */
  male();
}
start();
</script>
