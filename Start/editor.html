<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Editor</title>
<style>
/* ============================================================
   1 — GRUNDLAGEN

   Alle Farb- und Formwerte stehen hier als Token. Weiter unten wird
   nichts hart codiert — sonst lässt sich kein zweites Thema bauen,
   ohne dreißig Stellen zu suchen.

   `color-scheme: light` ist keine Kosmetik: Ohne diese Zeile färbt
   Windows im Dunkelmodus Scrollbalken und Formularfelder selbst ein,
   und zwar schwarz.
   ============================================================ */
:root{
  color-scheme: light;

  --grund:#ffffff;        /* das Blatt */
  --rand:#f7f7f5;         /* Leisten, Fußzeile */
  --tinte:rgb(55,53,47);  /* tragender Text */
  /* Notions eigene Grauwerte liegen unter 4,5 : 1 — .62 ergibt auf
     Weiß nur 3,86 : 1. Sie sind nachgedunkelt: Der Ton bleibt, die
     Helligkeit nicht. `werkzeug/pruefen.mjs` rechnet das nach. */
  --tinte2:rgba(55,53,47,.70);   /* 4,68 : 1 — tragender Nebentext */
  --tinte3:rgba(55,53,47,.55);   /* 3,16 : 1 — Etiketten, Fußleiste */
  --blass:rgba(55,53,47,.36);    /* 2,02 : 1 — nur Platzhalter */
  --linie:rgba(55,53,47,.11);
  --linie2:rgba(55,53,47,.07);
  --strich:rgba(55,53,47,.06);   /* Fläche unter dem Zeiger */
  --blau:rgb(35,131,226);
  --rot:rgb(180,50,44);   /* 6,13 : 1 — Warnung, nicht Kategorie */
  --blau-s:rgba(35,131,226,.28);
  --code-g:rgb(247,246,243);
  --code-t:rgb(186,67,63);
  --marker:rgb(251,243,196);

  --rad:5px;
  --rad-gr:8px;
  --spalte:708px;         /* Notions Schreibbreite. Nicht verhandelbar. */
  --einzug:26px;          /* eine Stufe Einrückung in der Anzeige */
  --schrift:ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",
            Roboto,Helvetica,Arial,sans-serif;
  --fest:ui-monospace,Consolas,"Courier New",monospace;
}

/* ---------- Das zweite Thema ----------
   `color-scheme` wandert mit: Ohne das färbt Windows Scrollbalken und
   Formularfelder nach der Systemeinstellung ein, und zwar gegen das
   gewählte Thema. Die hellen Werte oben bleiben die Vorgabe — hier
   stehen nur die, die sich ändern. */
:root[data-thema="dunkel"]{
  color-scheme: dark;

  --grund:rgb(25,25,25);
  --rand:rgb(33,33,33);
  --tinte:rgba(255,255,255,.92);
  --tinte2:rgba(255,255,255,.74);
  --tinte3:rgba(255,255,255,.56);
  --blass:rgba(255,255,255,.34);
  --linie:rgba(255,255,255,.14);
  --linie2:rgba(255,255,255,.08);
  --strich:rgba(255,255,255,.07);
  --blau:rgb(84,166,247);
  --blau-s:rgba(84,166,247,.34);
  --code-g:rgb(38,38,38);
  --code-t:rgb(233,140,131);
  --marker:rgb(112,88,24);
  --rot:rgb(240,133,124);
}

/* ---------- Der Satz ----------
   Blocksatz ist eine Einstellung der Anzeige, kein Merkmal des
   Textes: Markdown beschreibt, **was** etwas ist, nicht wie es
   aussieht. In der Datei steht davon nichts
   (doku/ENTSCHEIDUNGEN.md, Punkt 9). */
:root[data-satz="blocksatz"] .blk.absatz .txt,
:root[data-satz="blocksatz"] .blk.zitat .txt,
:root[data-satz="blocksatz"] .blk.callout .txt{text-align:justify;hyphens:auto}

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}

/* Jede Vollflächen-Komponente bemalt sich selbst. Sich auf `body` zu
   verlassen genügt nicht — im Dunkelmodus bleibt sonst eine Fläche
   schwarz, und der Prüflauf sieht davon nichts. */
html,body{background:var(--grund)!important;color:var(--tinte)!important;height:100%}
body{font-family:var(--schrift);font-size:16px;line-height:1.5;
  -webkit-font-smoothing:antialiased}

.app{display:flex;flex-direction:column;height:100vh;background:var(--grund)}

/* ---------- Kopfleiste ---------- */
.kopf{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:9px 16px;
  background:var(--grund);border-bottom:1px solid var(--linie2);font-size:13.5px}
.kopf .name{display:flex;align-items:center;gap:7px;padding:4px 8px;border-radius:var(--rad);
  color:var(--tinte2);cursor:pointer}
.kopf .name:hover{background:var(--strich)}
.kopf .name svg{color:var(--tinte3)}
.kopf .sp{flex:1}
.kopf button{font:inherit;font-size:13px;color:var(--tinte2);background:none;border:0;
  padding:5px 10px;border-radius:var(--rad);cursor:pointer}
.kopf button:hover{background:var(--strich)}
.kopf .wechsel{display:flex;background:var(--strich);border-radius:6px;padding:2px}
.kopf .wechsel button{padding:3px 11px;border-radius:4px;font-size:12.5px}
.kopf .wechsel button[aria-current="true"]{background:var(--grund);color:var(--tinte);
  font-weight:500;box-shadow:0 1px 2px rgba(15,15,15,.12)}
.kopf .akt{border:1px solid var(--linie)}

/* ---------- Rumpf ---------- */
.rumpf{flex:1;min-height:0;display:flex;background:var(--grund)}
.blatt{flex:1;min-width:0;overflow-y:auto;background:var(--grund);padding:44px 0 40vh}
.blatt .spalte{max-width:var(--spalte);margin:0 auto;padding:0 60px}
.quelle{width:46%;flex-shrink:0;background:var(--rand);border-left:1px solid var(--linie2);
  display:flex;flex-direction:column}
.quelle .qkopf{flex-shrink:0;display:flex;align-items:center;gap:10px;padding:8px 16px;
  font-size:11.5px;color:var(--tinte3);border-bottom:1px solid var(--linie2);
  background:var(--rand)}
.quelle .qkopf .sp{flex:1}
.quelle textarea{flex:1;min-height:0;width:100%;resize:none;border:0;outline:none;
  background:var(--rand);color:var(--tinte);font-family:var(--fest);font-size:13.5px;
  line-height:1.7;padding:16px 18px 40vh;tab-size:2}
.quelle textarea[readonly]{color:var(--tinte2)}

/* Die drei Ansichten. `display` steht bewusst in keiner ID-Regel —
   eine ID schlägt jede Klasse und bräche jedes Umschalten. */
.app[data-ansicht="schreiben"] .quelle{display:none}
.app[data-ansicht="quelltext"] .blatt{display:none}
.app[data-ansicht="quelltext"] .quelle{width:100%;border-left:0}

/* ---------- Gliederung ----------
   Rechts die Überschriften, die springt. Sie ersetzt keinen
   Seitenbaum — es gibt nur diese eine Datei — sondern zeigt, wie sie
   gebaut ist. */
.gliederung{width:238px;flex-shrink:0;background:var(--rand);
  border-left:1px solid var(--linie2);display:flex;flex-direction:column}
.app[data-gliederung="aus"] .gliederung{display:none}
.app[data-ansicht="quelltext"] .gliederung{display:none}
.gliederung .gkopf{flex-shrink:0;padding:9px 13px 7px;font-size:11px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--tinte3);border-bottom:1px solid var(--linie2)}
.gliederung .liste{flex:1;min-height:0;overflow-y:auto;padding:6px}
.gliederung .z{display:block;width:100%;font:inherit;font-size:13px;text-align:left;
  padding:5px 8px;border:0;border-radius:var(--rad);background:none;color:var(--tinte2);
  cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gliederung .z:hover{background:var(--strich);color:var(--tinte)}
.gliederung .s1{font-weight:600;color:var(--tinte)}
.gliederung .s2{padding-left:20px}
.gliederung .s3{padding-left:34px}
.gliederung .leer{padding:10px 9px;font-size:12.5px;color:var(--tinte3);line-height:1.5}
.gliederung .gfuss{flex-shrink:0;border-top:1px solid var(--linie2);padding:7px}
.gliederung .gfuss button{width:100%;font:inherit;font-size:12.5px;padding:6px 9px;
  border:1px solid var(--linie);border-radius:var(--rad);background:var(--grund);
  color:var(--tinte2);cursor:pointer}
.gliederung .gfuss button:hover{background:var(--strich);color:var(--tinte)}

/* ---------- Suchen ----------
   Die Suche des Browsers findet nur, was gerade sichtbar ist — den
   Rohtext eines Blocks also nicht, und in der Schreibansicht steht
   der halbe Text als Ergebnis da. Deshalb eine eigene. */
.suchen{position:fixed;top:52px;right:20px;z-index:56;display:none;align-items:center;
  gap:6px;padding:6px 8px;background:var(--grund);border:1px solid var(--linie);
  border-radius:var(--rad-gr);box-shadow:0 8px 26px rgba(15,15,15,.18)}
.suchen.an{display:flex}
/* Ist die Gliederung sichtbar, rückt die Suche davor — sonst verdeckt
   sie deren oberste Zeile. */
.app:not([data-gliederung="aus"]):not([data-ansicht="quelltext"]) ~ .suchen{right:258px}
.suchen input{font:inherit;font-size:13.5px;width:190px;padding:5px 8px;
  border:1px solid var(--linie);border-radius:var(--rad);background:var(--grund);
  color:var(--tinte);outline:none}
.suchen input:focus{border-color:var(--blau)}
.suchen .zahl{font-size:12px;color:var(--tinte3);min-width:64px;text-align:center}
.suchen button{font:inherit;font-size:13px;padding:4px 8px;border:0;border-radius:var(--rad);
  background:none;color:var(--tinte2);cursor:pointer;display:grid;place-items:center}
.suchen button:hover{background:var(--strich);color:var(--tinte)}
.suchen svg{width:15px;height:15px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.txt .fund{background:var(--marker);font-style:normal;border-radius:2px;
  box-shadow:0 0 0 1px rgba(55,53,47,.14)}

/* ---------- Fußleiste ---------- */
.fuss{flex-shrink:0;display:flex;align-items:center;gap:16px;padding:6px 16px;
  background:var(--rand);border-top:1px solid var(--linie2);font-size:11.5px;
  color:var(--tinte3)}
.fuss b{font-weight:600;color:var(--tinte2)}
.fuss .sp{flex:1}
.fuss .neu{color:var(--blau)}

/* ============================================================
   2 — DIE BLÖCKE
   Ein Block ist eine Zeile Markdown, die aussieht wie das, was sie
   bedeutet. Der Block unter der Schreibmarke zeigt seinen Rohtext,
   alle anderen zeigen das Ergebnis.
   ============================================================ */
.blk{position:relative;display:flex;align-items:flex-start;gap:8px;
  padding:2px 2px;border-radius:3px;
  margin-left:calc(var(--tiefe,0) * var(--einzug))}
.blk.ueber{background:rgba(55,53,47,.02)}
.blk.zielvor{box-shadow:0 -2px 0 var(--blau)}
.blk.zielnach{box-shadow:0 2px 0 var(--blau)}
.blk .griff{position:absolute;left:-46px;top:1px;display:flex;gap:1px;opacity:0}
.blk:hover .griff,.blk:focus-within .griff{opacity:1}
.blk .griff button{background:none;border:0;padding:3px;border-radius:4px;cursor:grab;
  color:var(--blass);display:flex}
.blk .griff button:hover{background:var(--strich);color:var(--tinte2)}
.blk .griff svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.7;fill:none;
  stroke-linecap:round;stroke-linejoin:round}

.txt{flex:1;min-width:0;outline:none;white-space:pre-wrap;word-wrap:break-word}
.txt:empty::before{content:attr(data-leer);color:var(--blass);pointer-events:none}

/* Blockarten */
.blk.h1 .txt{font-size:30px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.blk.h2 .txt{font-size:24px;font-weight:600;line-height:1.3}
.blk.h3 .txt{font-size:19px;font-weight:600;line-height:1.35}
.blk.h1{margin-top:26px}
.blk.h2{margin-top:20px}
.blk.h3{margin-top:16px}
.blk.zitat .txt{border-left:3px solid var(--tinte);padding-left:14px}
.blk .marke{flex-shrink:0;width:22px;text-align:center;color:var(--tinte2);
  line-height:1.5;user-select:none}
.blk.nummer .marke{font-variant-numeric:tabular-nums;font-size:15px}
.blk.todo .marke{padding-top:4px}
.blk.todo .kasten{width:16px;height:16px;border-radius:3px;border:1.5px solid var(--tinte3);
  background:none;padding:0;cursor:pointer;display:grid;place-items:center}
.blk.todo .kasten svg{width:12px;height:12px;stroke:#fff;stroke-width:2.4;fill:none;
  stroke-linecap:round;stroke-linejoin:round;visibility:hidden}
.blk.todo.fertig .kasten{background:var(--blau);border-color:var(--blau)}
.blk.todo.fertig .kasten svg{visibility:visible}
.blk.todo.fertig .txt{color:var(--tinte3);text-decoration:line-through}
.blk.code{margin:6px 0}
.blk.code .txt{background:var(--code-g);border-radius:var(--rad);padding:26px 15px 15px;
  font-family:var(--fest);font-size:13.5px;line-height:1.6}
.blk.code .sprache{position:absolute;left:17px;top:7px;font-size:11.5px;color:var(--tinte3);
  pointer-events:none}
.blk.linie{padding:12px 2px}
.blk.linie .strich{flex:1;height:1px;background:var(--linie)}

/* ---------- Tabelle, Callout, Toggle ----------
   Die drei Blöcke jenseits von reinem Markdown. Jeder trägt sein
   Urteil sichtbar — HTML nur als Notausgang, und gekennzeichnet
   (doku/ENTSCHEIDUNGEN.md, Punkt 1). */
.blk .urteil{position:absolute;right:4px;top:3px;font-size:9.5px;letter-spacing:.05em;
  text-transform:uppercase;color:var(--tinte3);background:var(--rand);
  border:1px solid var(--linie2);border-radius:3px;padding:1px 5px;
  pointer-events:none;opacity:0;transition:opacity .12s}
.blk:hover .urteil,.blk:focus-within .urteil{opacity:1}

.blk.tabelle,.blk.callout,.blk.toggle{margin:10px 0}
.blk.tabelle table{border-collapse:collapse;width:100%;font-size:14.5px}
.blk.tabelle th,.blk.tabelle td{border:1px solid var(--linie);padding:6px 10px;
  text-align:left;vertical-align:top}
.blk.tabelle th{background:var(--rand);font-weight:600}

.blk.callout .txt{background:var(--rand);border-left:3px solid var(--blau);
  border-radius:var(--rad);padding:11px 14px}
.blk.callout.warnung .txt{border-left-color:var(--rot)}
.blk.callout .sorte{display:block;font-size:12px;font-weight:600;letter-spacing:.03em;
  color:var(--blau);margin-bottom:3px}
.blk.callout.warnung .sorte{color:var(--rot)}

.blk.toggle .txt{border:1px solid var(--linie);border-radius:var(--rad);padding:10px 13px}
/* Beide ausdrücklich als Block: Ohne das stünden Titel und Rumpf
   nur deshalb untereinander, weil zufällig ein Zeilenende dazwischen
   liegt. */
.blk.toggle .haupt{display:block;font-weight:600}
.blk.toggle .rumpf{display:block;margin-top:6px;color:var(--tinte2)}

/* Auszeichnung im Text */
.txt b{font-weight:600}
.txt img{display:block;max-width:100%;height:auto;margin:6px 0;border-radius:var(--rad)}
/* Ein Bild aus dem Netz wird **nicht** geladen: Die Anwendung greift
   zu keinem Zeitpunkt auf das Internet zu (harte Regel 2). Der
   Verweis bleibt in der Datei und wird hier benannt. */
.txt .fern{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;
  color:var(--tinte2);background:var(--rand);border:1px dashed var(--linie);
  border-radius:var(--rad);padding:3px 8px;font-family:var(--fest)}
.txt code{background:rgba(135,131,120,.15);color:var(--code-t);border-radius:3px;
  padding:1px 5px;font-family:var(--fest);font-size:.86em}
.txt .verweis{color:var(--blau);border-bottom:1px solid var(--blau-s)}
.txt mark{background:var(--marker);color:var(--tinte);border-radius:2px;padding:0 2px}

/* ---------- Meldungszettel ----------
   Hängt an body, nicht an .app: Er soll über allem liegen und von
   keinem Umschalter erwischt werden. */
.zettel{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(70px);
  /* Grund und Tinte über Kreuz: Im hellen Thema dunkel auf hell, im
     dunklen hell auf dunkel. Ein festes #fff wäre im zweiten Thema
     weiß auf weiß. */
  background:var(--tinte);color:var(--grund);padding:9px 18px;border-radius:var(--rad-gr);
  font-size:13.5px;box-shadow:0 8px 26px rgba(15,15,15,.28);opacity:0;
  pointer-events:none;z-index:60;max-width:70vw}
.zettel.an{opacity:1;transform:translateX(-50%) translateY(0)}

/* ---------- Die Auswahlleiste ----------
   Sie kommt zum Text, statt am Fensterrand zu warten. Dunkel, damit
   sie sich vom Blatt abhebt, ohne eine Fläche zu beanspruchen. */
.leiste{position:fixed;z-index:55;display:none;align-items:center;gap:1px;
  background:var(--tinte);border-radius:6px;padding:4px;
  box-shadow:0 6px 22px rgba(15,15,15,.30)}
.leiste.an{display:flex}
/* Dieselbe Kreuzung wie beim Meldungszettel: Die Leiste ist dunkel
   im hellen Thema und hell im dunklen. */
.leiste button{font:inherit;font-size:14px;line-height:1;min-width:29px;height:28px;
  padding:0 7px;border:0;border-radius:4px;background:none;color:var(--grund);
  opacity:.88;cursor:pointer;display:grid;place-items:center}
/* Neutrales Grau statt eines Themen-Tokens: Die Leiste hat in jedem
   Thema den **umgekehrten** Grund, und jeder Token wäre auf einem der
   beiden unsichtbar. */
.leiste button:hover{background:rgba(128,128,128,.38);opacity:1}
.leiste .tr{width:1px;height:17px;background:rgba(128,128,128,.5);margin:0 3px}
.leiste svg{width:16px;height:16px;stroke:currentColor;stroke-width:1.8;fill:none;
  stroke-linecap:round;stroke-linejoin:round}
.leiste .mk{background:var(--marker);color:rgb(55,53,47);border-radius:2px;padding:1px 4px}

/* ---------- Menüs ----------
   Eine Fläche für alle: Blockmenü und Slash-Menü unterscheiden sich
   im Inhalt, nicht in der Form. */
.menue{position:fixed;z-index:58;display:none;min-width:232px;max-height:70vh;
  overflow-y:auto;padding:5px;background:var(--grund);border:1px solid var(--linie);
  border-radius:var(--rad-gr);box-shadow:0 10px 34px rgba(15,15,15,.20)}
.menue.an{display:block}
.menue .k{padding:8px 9px 4px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--tinte3)}
.menue button{display:flex;align-items:center;gap:10px;width:100%;font:inherit;
  font-size:13.5px;padding:6px 9px;border:0;border-radius:var(--rad);background:none;
  color:var(--tinte);cursor:pointer;text-align:left}
.menue button:hover,.menue button.zeig{background:var(--strich)}
.menue button .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap}
.menue button .ta{font-size:11.5px;color:var(--tinte3);font-family:var(--fest);
  flex-shrink:0}
.menue .ic{width:26px;flex-shrink:0;color:var(--tinte3);font-size:11.5px;
  font-family:var(--fest);text-align:center}
.menue .tr{height:1px;background:var(--linie2);margin:5px 2px}
.menue .leer{padding:9px;font-size:13px;color:var(--tinte3)}

/* Das Slash-Menü hat eine zweite Spalte, die Notion nicht hat: Sie
   zeigt nicht, wie der Block aussieht, sondern **was in die Datei
   kommt** — und ob das überall läuft. Für einen Markdown-Editor ist
   das der Unterschied zwischen einem Werkzeug, dem man traut, und
   einem, das hinter dem Rücken HTML schreibt. */
.menue.slash{width:min(620px,94vw);padding:0;overflow:hidden}
.menue.slash.an{display:flex}
.menue.slash .liste{flex:1;min-width:0;max-height:344px;overflow-y:auto;padding:5px}
.menue.slash .vorschau{width:266px;flex-shrink:0;border-left:1px solid var(--linie2);
  background:var(--rand);padding:13px 14px;font-size:12.5px;color:var(--tinte2)}
.menue.slash .vorschau .k{padding:0 0 7px}
.menue.slash .vorschau pre{background:var(--grund);border:1px solid var(--linie);
  border-radius:var(--rad);padding:8px 10px;font-family:var(--fest);font-size:11.5px;
  line-height:1.55;white-space:pre-wrap;word-break:break-word;color:var(--tinte)}
.menue.slash .vorschau .ur{display:inline-block;margin-top:11px;font-size:10px;
  letter-spacing:.05em;text-transform:uppercase;border-radius:3px;padding:2px 6px;
  background:var(--grund);border:1px solid var(--linie);color:var(--tinte2)}
.menue.slash .vorschau .satz{margin-top:8px;line-height:1.55}

/* ---------- Einstellungen ----------
   Hängt an body, nicht an .app: Der Überzug soll über allem liegen
   und von keinem Ansichtsumschalter erwischt werden — dieselbe
   Überlegung wie beim Meldungszettel. */
.ueberzug{position:fixed;inset:0;z-index:70;background:rgba(15,15,15,.34);
  display:none;align-items:center;justify-content:center;padding:20px}
.ueberzug.an{display:flex}
.karte{width:min(600px,94vw);max-height:86vh;overflow-y:auto;background:var(--grund);
  color:var(--tinte);border-radius:var(--rad-gr);padding:22px 24px 24px;
  box-shadow:0 20px 64px rgba(15,15,15,.34)}
.karte .titel{font-size:17px;font-weight:600;margin-bottom:5px}
.karte .unter{font-size:13px;color:var(--tinte2);line-height:1.55;margin-bottom:20px}
.karte .gruppe{margin-bottom:20px}
.karte .etikett{font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;
  color:var(--tinte3);margin-bottom:8px}
.karte .wahl{display:flex;flex-wrap:wrap;gap:6px}
.karte .wahl button{font:inherit;font-size:13px;padding:6px 12px;border-radius:var(--rad);
  border:1px solid var(--linie);background:var(--grund);color:var(--tinte2);cursor:pointer}

  color:#fff}

  border:1px solid var(--linie);background:var(--grund);color:var(--tinte);cursor:pointer}

/* ============================================================
   DER DRUCK

   Das PDF entsteht über den Druckdialog des Browsers — ein eigener
   Erzeuger wäre eine fremde Bibliothek in einer Datei, die keine
   haben darf (harte Regel 2), und beherrschte Umbrüche schlechter.
   Die Arbeit steckt deshalb hier: in drei Layouts, zwischen denen
   die Einstellungen umschalten.

   Seitenzahlen und Kopfzeilen kommen aus dem Druckdialog selbst —
   der Browser setzt sie, nicht die Seite. Was hier steht, sind
   Schrift, Ränder, Umbrüche und Abstände.
   ============================================================ */
@media print{
  @page{margin:18mm}

  /* Alles, was Bedienung ist, gehört nicht aufs Papier. */
  .kopf,.fuss,.quelle,.gliederung,.leiste,.menue,.suchen,.ueberzug,.zettel,
  .blk .griff,.blk .urteil{display:none!important}

  html,body{background:#fff!important;color:#000!important;height:auto}
  .app{display:block;height:auto;background:#fff}
  .rumpf{display:block}
  .blatt{overflow:visible;padding:0;background:#fff}
  .blatt .spalte{max-width:none;padding:0}
  .txt{color:#000}

  /* Ein Block soll nicht mitten durch die Seite laufen, und eine
     Überschrift nicht allein unten stehen. */
  .blk.code,.blk.tabelle,.blk.callout,.blk.toggle{break-inside:avoid}
  .blk.h1,.blk.h2,.blk.h3{break-after:avoid}
  .blk.callout .txt,.blk.toggle .txt{background:none;border-color:#999}
  .blk.tabelle th{background:none}
  .txt .verweis{color:#000;border-bottom:1px solid #999}
  .txt .fund{background:none;box-shadow:none}

  /* ---------- Schlicht ---------- */
  :root[data-druck="schlicht"] .blatt{font-size:11pt;line-height:1.5}

  /* ---------- Technische Doku ----------
     Nummeriert die Überschriften selbst. Bei Texten, die ihre
     Nummern schon im Titel tragen, doppelt das — dann ist
     „Schlicht" das richtige Layout. */
  :root[data-druck="technik"] .blatt{font-size:10.5pt;line-height:1.45}
  :root[data-druck="technik"] .spalte{counter-reset:k1}
  :root[data-druck="technik"] .blk.h1{counter-reset:k2;break-before:page}
  :root[data-druck="technik"] .blk.h1:first-child{break-before:auto}
  :root[data-druck="technik"] .blk.h2{counter-reset:k3}
  :root[data-druck="technik"] .blk.h1 .txt::before{
    counter-increment:k1;content:counter(k1) "\00a0\00a0"}
  :root[data-druck="technik"] .blk.h2 .txt::before{
    counter-increment:k2;content:counter(k1) "." counter(k2) "\00a0\00a0"}
  :root[data-druck="technik"] .blk.h3 .txt::before{
    counter-increment:k3;content:counter(k1) "." counter(k2) "." counter(k3) "\00a0\00a0"}
  /* Oben Platz lassen: Dort sitzt die Sprachmarke, und ohne den
     Abstand steht sie in der ersten Codezeile. */
  :root[data-druck="technik"] .blk.code .txt{border:1px solid #999;background:none;
    padding:22px 13px 12px}
  :root[data-druck="technik"] .blk.tabelle th,
  :root[data-druck="technik"] .blk.tabelle td{border:1px solid #666}

  /* ---------- Manuskript ----------
     Eine Spalte, weiter Durchschuss, breiter Rand zum Hineinschreiben. */
  :root[data-druck="manuskript"] .blatt{font-size:12pt;line-height:2}
  :root[data-druck="manuskript"] .blatt .spalte{padding-right:48mm}
  :root[data-druck="manuskript"] .blk.h1 .txt{font-size:17pt}
  :root[data-druck="manuskript"] .blk.h2 .txt{font-size:14pt}
  :root[data-druck="manuskript"] .blk.h3 .txt{font-size:12.5pt}
}
</style>
</head>
